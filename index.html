<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BARRACUDA DRACONA COHORT Fitness Evaluation 2026-27</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            navy: {
              950: '#040914',
              900: '#081226',
              800: '#0F1E3A',
              700: '#182D54',
            },
            barracuda: {
              400: '#22D3EE',
              500: '#06B6D4',
              600: '#0891B2',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #040914;
      color: #F8FAFC;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom scrollbar for sleek look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #081226;
    }
    ::-webkit-scrollbar-thumb {
      background: #182D54;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #06B6D4;
    }
    /* Print stylesheet for clean PDF export */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-card {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        color: #000000 !important;
        box-shadow: none !important;
      }
      .print-text-dark {
        color: #0f172a !important;
      }
      .print-border {
        border-color: #cbd5e1 !important;
      }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    .timer-glow {
      animation: pulse-ring 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-navy-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-navy-950">

  <!-- Top Sticky Header & Progress Bar -->
  <header class="sticky top-0 z-40 bg-navy-900/95 backdrop-blur-md border-b border-navy-700/80 shadow-lg no-print">
    <div class="max-w-3xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-teal-600 flex items-center justify-center text-navy-950 font-extrabold shadow-md shadow-cyan-500/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-white">BARRACUDA</h1>
              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-cyan-500/15 text-cyan-400 border border-cyan-500/30">2025–26 Eval</span>
            </div>
            <p id="header-subtitle" class="text-xs text-slate-400 truncate max-w-[200px] sm:max-w-xs">Fitness Evaluation Protocol</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Sound Toggle -->
          <button id="btn-sound-toggle" type="button" onclick="toggleSound()" title="Toggle Timer Chime" class="p-2 rounded-xl bg-navy-800 hover:bg-navy-700 border border-navy-700 text-cyan-400 transition">
            <svg id="icon-sound-on" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            </svg>
            <svg id="icon-sound-off" class="w-4 h-4 hidden text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
            </svg>
          </button>

          <!-- Step Drawer / Quick Jump -->
          <button type="button" onclick="toggleStepDrawer()" class="px-2.5 py-1.5 rounded-xl bg-navy-800 hover:bg-navy-700 border border-navy-700 text-xs font-semibold text-slate-200 flex items-center gap-1.5 transition">
            <span id="step-counter-badge">Step 1/10</span>
            <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="w-full h-2 bg-navy-950 rounded-full overflow-hidden border border-navy-800">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-500 to-teal-400 transition-all duration-300 rounded-full" style="width: 10%;"></div>
      </div>
    </div>

    <!-- Collapsible Step Navigation Drawer -->
    <div id="step-drawer" class="hidden border-t border-navy-800 bg-navy-900 px-4 py-3 max-h-72 overflow-y-auto">
      <div class="max-w-3xl mx-auto">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Jump to Station</span>
          <button type="button" onclick="confirmResetAll()" class="text-xs text-rose-400 hover:text-rose-300 font-medium">Reset Form Data</button>
        </div>
        <div id="step-drawer-list" class="grid grid-cols-1 sm:grid-cols-2 gap-1.5"></div>
      </div>
    </div>
  </header>

  <!-- Toast / Message Banner (No alert() used anywhere) -->
  <div id="toast-container" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 translate-y-4">
    <div id="toast-box" class="px-4 py-2.5 rounded-2xl bg-navy-800 border border-cyan-500/50 text-white text-sm font-medium shadow-xl flex items-center gap-2">
      <span id="toast-icon" class="text-cyan-400">✓</span>
      <span id="toast-msg">Saved</span>
    </div>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-navy-950/80 backdrop-blur-sm p-4 no-print">
    <div class="bg-navy-900 border border-navy-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
      <h3 id="confirm-title" class="text-lg font-bold text-white mb-2">Confirm Action</h3>
      <p id="confirm-text" class="text-sm text-slate-300 mb-5">Are you sure?</p>
      <div class="flex justify-end gap-2.5">
        <button type="button" onclick="closeConfirmModal()" class="px-4 py-2 rounded-xl bg-navy-800 hover:bg-navy-700 text-slate-300 text-sm font-semibold transition">Cancel</button>
        <button id="confirm-yes-btn" type="button" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold transition">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 pb-28">
    <div id="wizard-container"></div>
  </main>

  <!-- Sticky Bottom Navigation Footer -->
  <footer id="bottom-nav" class="fixed bottom-0 inset-x-0 z-30 bg-navy-900/95 backdrop-blur-md border-t border-navy-700/80 px-4 py-3 no-print">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
      <button id="btn-prev" type="button" onclick="prevStep()" class="px-4 py-3 rounded-xl bg-navy-800 hover:bg-navy-700 disabled:opacity-40 disabled:pointer-events-none text-slate-200 font-semibold text-sm flex items-center gap-1.5 border border-navy-700 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        <span>Back</span>
      </button>

      <div class="text-center hidden sm:block">
        <span id="autosave-indicator" class="text-xs text-slate-400 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
          Auto-saved locally
        </span>
      </div>

      <button id="btn-next" type="button" onclick="nextStep()" class="flex-1 sm:flex-initial sm:min-w-[210px] px-5 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-navy-950 font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20 transition">
        <span id="btn-next-label">Continue</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </footer>

  <script>
    // =========================================================================
    // COACH CONFIGURATION: GOOGLE APPS SCRIPT WEB APP URL
    // Paste your deployed Google Apps Script Web App URL between the quotes below
    // (e.g., "https://script.google.com/macros/s/AKfycbx.../exec")
    // =========================================================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA7ZRC1ld1noJfYgOFwsu0PsSfS49fDT9WtMkm8CdF_1rXUryC8gbjDaxTtvjTvQOv/exec";

    // =========================================================================
    // STATE & DATA MODEL
    // =========================================================================
    const STORAGE_KEY = 'barracuda_eval_2025_2026_v1';
    const SHEET_URL_OVERRIDE_KEY = 'barracuda_sheet_url_override_v1';

    const defaultData = {
      currentStepId: 'step0',
      athleteName: '',
      signature: '',
      ageCategory: 'Premier',
      bodyWeight: '',
      weightUnit: 'lbs',
      morningRHR: '',
      sleepQuantity: 7,
      sleepQuality: 7,
      safetyAck: false,
      // Step 1: Sit & Reach
      sitReachTrial1: '',
      sitReachTrial2: '',
      sitReachTrial3: '',
      sitReachBest: '',
      // Step 2: 2-Min Row Erg
      row2Min1Effort: '',
      row2Min1Dist: '',
      row2FinishEffort: '',
      row2Split2Dist: '',
      row2TotalDist: '',
      row2FinishHR: '',
      // Step 3: Pull Ups
      pullUpReps: '',
      pullUpBand: 'None (Bodyweight)',
      // Step 4: Bench Press 50% BW
      bench50Load: '',
      bench50Reps: '',
      // Step 5: One-Arm DB Row Left
      dbRowLeftLoad: '',
      dbRowLeftReps: '',
      // Step 6: One-Arm DB Row Right
      dbRowRightLoad: '',
      dbRowRightReps: '',
      // Step 7: Core Stability Plank
      plankSeconds: '',
      plankStageReached: 'Stage 8 (Full 180s Completed)',
      // Optional stations toggle & data
      includeOptional: false,
      optBench120Load: '120',
      optBench120Reps: '',
      optBenchPullLoad: '',
      optBenchPullReps: '',
      // 6-Min Personal Row Erg
      erg6TotalDist: '',
      erg6Min2Effort: '',
      erg6Min2Dist: '',
      erg6Min4Effort: '',
      erg6Min4Dist: '',
      erg6FinishEffort: '',
      erg6FinalSplitDist: '',
      erg6FinishHR: '',
      // Track completed steps & sheet submission status
      completedSteps: {},
      lastSheetSubmission: ''
    };

    let state = loadState();
    let isSubmittingToSheet = false;
    let soundEnabled = true;

    // Rest timer state
    let restInterval = null;
    let restRemainingSec = 0;
    let restTotalSec = 0;
    let restRunning = false;
    let activeRestStepId = null;

    // Plank 180s guide stopwatch state
    let plankGuideInterval = null;
    let plankGuideElapsed = 0;
    let plankGuideRunning = false;

    const PLANK_STAGES = [
      { stage: 1, title: 'Start Position (Straight-Arm Plank)', dur: 60, start: 0, end: 60, desc: 'Hands on mat directly under shoulders, straight arms (NOT elbows), body in a straight line.' },
      { stage: 2, title: 'Right Arm Extended Forward', dur: 15, start: 60, end: 75, desc: 'Lift right arm off ground and extend parallel to floor. Look straight down.' },
      { stage: 3, title: 'Left Arm Extended Forward', dur: 15, start: 75, end: 90, desc: 'Return to Start Position, then lift left arm parallel to floor.' },
      { stage: 4, title: 'Right Leg Extended Back', dur: 15, start: 90, end: 105, desc: 'Return to Start Position, then lift right leg off ground parallel to floor.' },
      { stage: 5, title: 'Left Leg Extended Back', dur: 15, start: 105, end: 120, desc: 'Return to Start Position, then lift left leg off ground parallel to floor.' },
      { stage: 6, title: 'Left Leg + Right Arm Extended', dur: 15, start: 120, end: 135, desc: 'Return to Start Position, then extend left leg and right arm simultaneously.' },
      { stage: 7, title: 'Right Leg + Left Arm Extended', dur: 15, start: 135, end: 150, desc: 'Return to Start Position, then extend right leg and left arm simultaneously.' },
      { stage: 8, title: 'Final Start Position Hold', dur: 30, start: 150, end: 180, desc: 'Return to straight-arm Start Position and hold steady until 180s completion.' }
    ];

    // =========================================================================
    // WIZARD STEP DEFINITIONS
    // =========================================================================
    function getSteps() {
      const steps = [
        { id: 'step0', type: 'station', badge: 'Baseline & Safety', title: 'Athlete Profile & Readiness', shortTitle: '0. Athlete Profile' },
        { id: 'step1', type: 'station', badge: 'Station 1', title: 'Sit & Reach Assessment', shortTitle: '1. Sit & Reach' },
        { id: 'step2', type: 'station', badge: 'Station 2', title: '2-Minute Rowing Ergometer', shortTitle: '2. 2-Min Row Erg' },
        {
          id: 'rest_after_2min',
          type: 'rest',
          badge: 'Mandatory Recovery',
          title: '15-Minute Rest Period',
          shortTitle: 'Rest: 15 Min',
          durationSec: 15 * 60,
          nextStationTitle: 'Station 3: Dead Hang Pull-Ups',
          prepChecklist: [
            'Hydrate and allow heart rate to recover fully after the 2-minute maximal ergometer effort.',
            'Inspect the pull-up bar and select a resistance band if needed for assisted progression.',
            'Review protocol: Overhand grip, chin clearly above bar, full dead-hang extension, zero kipping.'
          ]
        },
        { id: 'step3', type: 'station', badge: 'Station 3', title: 'Dead Hang Pull-Ups (Max Rep)', shortTitle: '3. Pull-Ups' },
        {
          id: 'rest_after_pullup',
          type: 'rest',
          badge: 'Mandatory Recovery',
          title: '5-Minute Rest Period',
          shortTitle: 'Rest: 5 Min',
          durationSec: 5 * 60,
          nextStationTitle: 'Station 4: Bench Press Max Rep (50% BW)',
          prepChecklist: [
            `Load barbell to 50% Body Weight (${getTargetWeight(50) ? getTargetWeight(50) + ' lbs' : 'rounded to nearest 5 lbs'}).`,
            'Ensure collars are secured on the barbell and a spotter/monitor is ready.',
            'Review protocol: Feet flat on floor, bar touches chest, full lockout, continuous ~1 rep/sec tempo.'
          ]
        },
        { id: 'step4', type: 'station', badge: 'Station 4', title: 'Bench Press Max Rep (50% BW)', shortTitle: '4. Bench Press (50%)' },
        {
          id: 'rest_after_bench',
          type: 'rest',
          badge: 'Mandatory Recovery',
          title: '5-Minute Rest Period',
          shortTitle: 'Rest: 5 Min',
          durationSec: 5 * 60,
          nextStationTitle: 'Station 5A: One-Arm DB Row — Left Arm (25% BW)',
          prepChecklist: [
            `Select dumbbell equal to 25% Body Weight (${getTargetWeight(25) ? getTargetWeight(25) + ' lbs' : 'rounded to nearest 5 lbs'}).`,
            'Set up a flat bench with clear floor space for kneeling one-knee support.',
            'Review protocol: 60-second max reps, pull DB to front shoulder (anterior deltoid), full arm extension.'
          ]
        },
        { id: 'step5', type: 'station', badge: 'Station 5A', title: 'One-Arm DB Row — Left Arm (60")', shortTitle: '5A. DB Row Left' },
        {
          id: 'rest_between_arms',
          type: 'rest',
          badge: 'Inter-Arm Recovery',
          title: '3-Minute Rest Between Arms',
          shortTitle: 'Rest: 3 Min',
          durationSec: 3 * 60,
          nextStationTitle: 'Station 5B: One-Arm DB Row — Right Arm (25% BW)',
          prepChecklist: [
            'Shake out grip and upper back during the 3-minute recovery.',
            `Use the exact same dumbbell weight (${state.dbRowLeftLoad || getTargetWeight(25) || '25% BW'} lbs) as your Left Arm.`,
            'Review protocol: 60-second max reps, contact anterior deltoid at top, full extension at bottom.'
          ]
        },
        { id: 'step6', type: 'station', badge: 'Station 5B', title: 'One-Arm DB Row — Right Arm (60")', shortTitle: '5B. DB Row Right' },
        {
          id: 'rest_before_plank',
          type: 'rest',
          badge: 'Mandatory Recovery',
          title: '5-Minute Rest Period',
          shortTitle: 'Rest: 5 Min',
          durationSec: 5 * 60,
          nextStationTitle: 'Station 6: Core Stability Assessment (Straight-Arm Plank)',
          prepChecklist: [
            'Place an exercise mat on a flat non-slip surface.',
            'Important Protocol Note: Perform on YOUR HANDS with STRAIGHT ARMS under shoulders (not on elbows).',
            'Review the 8 continuous stages totaling 180 seconds (3 minutes).'
          ]
        },
        { id: 'step7', type: 'station', badge: 'Station 6', title: 'Core Stability Assessment', shortTitle: '6. Core Stability' },
        { id: 'optionalPrompt', type: 'prompt', badge: 'Evaluations #2 & #3', title: 'Optional Additional Stations', shortTitle: 'Optional Check' }
      ];

      if (state.includeOptional) {
        steps.push(
          {
            id: 'rest_before_opt_bench',
            type: 'rest',
            badge: 'Mandatory Recovery',
            title: '5-Minute Rest Period',
            shortTitle: 'Rest: 5 Min',
            durationSec: 5 * 60,
            nextStationTitle: 'Optional Station 8: Bench Press Max Rep (120 lbs)',
            prepChecklist: [
              'Load barbell to 120 lbs with collars secured.',
              'Review protocol: Full extension at top, bar touches chest, feet flat on floor, ~1 rep/sec tempo.'
            ]
          },
          { id: 'step8', type: 'station', badge: 'Optional Station 8', title: 'Bench Press Max Rep (120 lbs)', shortTitle: '8. Opt. Bench 120#' },
          {
            id: 'rest_before_opt_pull',
            type: 'rest',
            badge: 'Mandatory Recovery',
            title: '5-Minute Rest Period',
            shortTitle: 'Rest: 5 Min',
            durationSec: 5 * 60,
            nextStationTitle: 'Optional Station 9: Bench Pull Max Rep (50% BW)',
            prepChecklist: [
              `Load barbell to 50% Body Weight (${getTargetWeight(50) ? getTargetWeight(50) + ' lbs' : 'rounded to nearest 5 lbs'}).`,
              'Review protocol: Chest flat on bench, feet unanchored, hands do not swing past chin, bar touches bench each rep.'
            ]
          },
          { id: 'step9', type: 'station', badge: 'Optional Station 9', title: 'Bench Pull Max Rep (50% BW)', shortTitle: '9. Opt. Bench Pull' }
        );
      }

      steps.push({
        id: 'summary',
        type: 'summary',
        badge: 'Final Report',
        title: 'Summary & 6-Min Erg Submission',
        shortTitle: 'Summary & Submit'
      });

      return steps;
    }

    // =========================================================================
    // PERSISTENCE & HELPERS
    // =========================================================================
    function getActiveGoogleScriptUrl() {
      // 1. Primary hardcoded constant
      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.trim() !== '') {
        return GOOGLE_SCRIPT_URL.trim();
      }
      // 2. Optional ?sheetUrl=... query parameter (also saved locally for convenience)
      try {
        const params = new URLSearchParams(window.location.search);
        const paramUrl = params.get('sheetUrl');
        if (paramUrl && paramUrl.trim().startsWith('https://')) {
          localStorage.setItem(SHEET_URL_OVERRIDE_KEY, paramUrl.trim());
          return paramUrl.trim();
        }
        const storedOverride = localStorage.getItem(SHEET_URL_OVERRIDE_KEY);
        if (storedOverride && storedOverride.trim().startsWith('https://')) {
          return storedOverride.trim();
        }
      } catch (e) {
        console.warn('Unable to read sheetUrl override:', e);
      }
      return '';
    }

    function saveSheetUrlOverride(url) {
      const cleaned = (url || '').trim();
      try {
        if (cleaned) {
          localStorage.setItem(SHEET_URL_OVERRIDE_KEY, cleaned);
          showToast('Google Sheet Web App URL saved locally', '🔗');
        } else {
          localStorage.removeItem(SHEET_URL_OVERRIDE_KEY);
          showToast('Custom Google Sheet URL cleared', '🗑️');
        }
      } catch (e) {
        console.warn('Unable to save sheetUrl override:', e);
      }
      renderCurrentStep();
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...defaultData };
        const parsed = JSON.parse(raw);
        return { ...defaultData, ...parsed };
      } catch (e) {
        console.warn('Failed to load saved state:', e);
        return { ...defaultData };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('Failed to save state:', e);
      }
    }

    function updateField(key, value) {
      state[key] = value;

      // Auto-calculate best Sit & Reach when trials change
      if (key === 'sitReachTrial1' || key === 'sitReachTrial2' || key === 'sitReachTrial3') {
        const vals = [state.sitReachTrial1, state.sitReachTrial2, state.sitReachTrial3]
          .map(v => parseFloat(v))
          .filter(v => !isNaN(v));
        if (vals.length > 0) {
          state.sitReachBest = String(Math.max(...vals));
          const bestEl = document.getElementById('input-sitReachBest');
          if (bestEl) bestEl.value = state.sitReachBest;
        }
      }

      // Auto-fill target weights (rounded to nearest 5 lbs) if empty
      if (key === 'bodyWeight') {
        const w50 = getTargetWeight(50);
        const w25 = getTargetWeight(25);
        if (w50) {
          if (!state.bench50Load) state.bench50Load = String(w50);
          if (!state.optBenchPullLoad) state.optBenchPullLoad = String(w50);
        }
        if (w25) {
          if (!state.dbRowLeftLoad) state.dbRowLeftLoad = String(w25);
          if (!state.dbRowRightLoad) state.dbRowRightLoad = String(w25);
        }
      }

      saveState();
    }

    function getBodyWeightLbs() {
      const bw = parseFloat(state.bodyWeight);
      if (isNaN(bw) || bw <= 0) return null;
      return state.weightUnit === 'kg' ? bw * 2.20462 : bw;
    }

    function getBodyWeightKg() {
      const bw = parseFloat(state.bodyWeight);
      if (isNaN(bw) || bw <= 0) return null;
      return state.weightUnit === 'kg' ? bw : bw / 2.20462;
    }

    function getTargetWeight(percent) {
      const bwLbs = getBodyWeightLbs();
      if (!bwLbs) return null;
      const rawTarget = bwLbs * (percent / 100);
      return Math.round(rawTarget / 5) * 5;
    }

    function getRelativeErgDistance(metersStr) {
      const m = parseFloat(metersStr);
      const bwKg = getBodyWeightKg();
      if (isNaN(m) || m <= 0 || !bwKg) return '—';
      // Standard Concept2 Weight-Adjusted / Relative distance metric
      const wf = Math.pow(bwKg / 122.47, 0.222);
      const corrected = Math.round(m / wf);
      return `${corrected} m (Wf: ${wf.toFixed(3)})`;
    }

    function getRelativeErgMetersOnly(metersStr) {
      const m = parseFloat(metersStr);
      const bwKg = getBodyWeightKg();
      if (isNaN(m) || m <= 0 || !bwKg) return '';
      const wf = Math.pow(bwKg / 122.47, 0.222);
      return String(Math.round(m / wf));
    }

    function showToast(msg, icon = '✓') {
      const container = document.getElementById('toast-container');
      const iconEl = document.getElementById('toast-icon');
      const msgEl = document.getElementById('toast-msg');
      if (!container || !iconEl || !msgEl) return;

      iconEl.textContent = icon;
      msgEl.textContent = msg;
      container.classList.remove('opacity-0', 'translate-y-4');
      container.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        container.classList.remove('opacity-100', 'translate-y-0');
        container.classList.add('opacity-0', 'translate-y-4');
      }, 2800);
    }

    // =========================================================================
    // AUDIO CHIME (TONE.JS)
    // =========================================================================
    function toggleSound() {
      soundEnabled = !soundEnabled;
      updateSoundIcons();
      showToast(soundEnabled ? 'Timer audio chime enabled' : 'Timer audio chime muted', soundEnabled ? '🔔' : '🔕');
    }

    function updateSoundIcons() {
      const onIcon = document.getElementById('icon-sound-on');
      const offIcon = document.getElementById('icon-sound-off');
      if (!onIcon || !offIcon) return;
      if (soundEnabled) {
        onIcon.classList.remove('hidden');
        offIcon.classList.add('hidden');
      } else {
        onIcon.classList.add('hidden');
        offIcon.classList.remove('hidden');
      }
    }

    async function playChime(type = 'complete') {
      if (!soundEnabled || typeof Tone === 'undefined') return;
      try {
        await Tone.start();
        const synth = new Tone.Synth({
          oscillator: { type: 'sine' },
          envelope: { attack: 0.02, decay: 0.2, sustain: 0.2, release: 0.6 }
        }).toDestination();
        const now = Tone.now();
        if (type === 'complete') {
          synth.triggerAttackRelease('C5', '8n', now);
          synth.triggerAttackRelease('E5', '8n', now + 0.16);
          synth.triggerAttackRelease('G5', '4n', now + 0.32);
        } else {
          synth.triggerAttackRelease('A4', '16n', now);
        }
      } catch (e) {
        console.warn('Audio playback skipped:', e);
      }
    }

    // =========================================================================
    // NAVIGATION & STEP DRAWER
    // =========================================================================
    function toggleStepDrawer() {
      const drawer = document.getElementById('step-drawer');
      if (!drawer) return;
      drawer.classList.toggle('hidden');
    }

    function jumpToStep(stepId) {
      stopRestTimer();
      stopPlankGuideTimer();
      state.currentStepId = stepId;
      saveState();
      const drawer = document.getElementById('step-drawer');
      if (drawer) drawer.classList.add('hidden');
      renderCurrentStep();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function confirmResetAll() {
      const modal = document.getElementById('confirm-modal');
      const title = document.getElementById('confirm-title');
      const text = document.getElementById('confirm-text');
      const yesBtn = document.getElementById('confirm-yes-btn');
      if (!modal || !yesBtn) return;

      title.textContent = 'Reset All Evaluation Data?';
      text.textContent = 'This will clear all entered measurements, reps, and timer progress on this device.';
      yesBtn.onclick = () => {
        stopRestTimer();
        stopPlankGuideTimer();
        localStorage.removeItem(STORAGE_KEY);
        state = { ...defaultData };
        saveState();
        closeConfirmModal();
        const drawer = document.getElementById('step-drawer');
        if (drawer) drawer.classList.add('hidden');
        renderCurrentStep();
        showToast('All evaluation data cleared', '🗑️');
      };
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeConfirmModal() {
      const modal = document.getElementById('confirm-modal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function prevStep() {
      const steps = getSteps();
      const idx = steps.findIndex(s => s.id === state.currentStepId);
      if (idx > 0) {
        stopRestTimer();
        stopPlankGuideTimer();
        state.currentStepId = steps[idx - 1].id;
        saveState();
        renderCurrentStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function nextStep() {
      const steps = getSteps();
      const idx = steps.findIndex(s => s.id === state.currentStepId);
      if (idx === -1) return;

      const current = steps[idx];

      // Validate Step 0 essentials before advancing
      if (current.id === 'step0') {
        if (!state.athleteName || !state.athleteName.trim()) {
          showToast('Please enter Athlete Full Name', '⚠️');
          const el = document.getElementById('input-athleteName');
          if (el) el.focus();
          return;
        }
        if (!state.bodyWeight || parseFloat(state.bodyWeight) <= 0) {
          showToast('Please enter Body Weight to calculate target loads', '⚠️');
          const el = document.getElementById('input-bodyWeight');
          if (el) el.focus();
          return;
        }
      }

      // Auto-populate target loads when entering strength stations if blank
      const w50 = getTargetWeight(50);
      const w25 = getTargetWeight(25);
      if (w50 && !state.bench50Load) state.bench50Load = String(w50);
      if (w25 && !state.dbRowLeftLoad) state.dbRowLeftLoad = String(w25);
      if (w25 && !state.dbRowRightLoad) state.dbRowRightLoad = String(w25);
      if (w50 && !state.optBenchPullLoad) state.optBenchPullLoad = String(w50);

      state.completedSteps[current.id] = true;

      if (idx < steps.length - 1) {
        stopRestTimer();
        stopPlankGuideTimer();
        state.currentStepId = steps[idx + 1].id;
        saveState();
        renderCurrentStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function chooseOptionalPath(includeOpt) {
      state.includeOptional = includeOpt;
      state.completedSteps['optionalPrompt'] = true;
      saveState();
      const steps = getSteps();
      const promptIdx = steps.findIndex(s => s.id === 'optionalPrompt');
      if (promptIdx !== -1 && promptIdx < steps.length - 1) {
        state.currentStepId = steps[promptIdx + 1].id;
        saveState();
        renderCurrentStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // =========================================================================
    // REST TIMER LOGIC
    // =========================================================================
    function formatSeconds(sec) {
      const s = Math.max(0, Math.floor(sec));
      const mins = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(mins).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    function initRestTimerForStep(step) {
      if (activeRestStepId !== step.id) {
        stopRestTimer();
        activeRestStepId = step.id;
        restTotalSec = step.durationSec;
        restRemainingSec = step.durationSec;
        restRunning = true;
        startRestInterval();
      }
    }

    function startRestInterval() {
      clearInterval(restInterval);
      restRunning = true;
      restInterval = setInterval(() => {
        if (restRemainingSec > 0) {
          restRemainingSec--;
          updateRestTimerUI();
          if (restRemainingSec === 10) {
            playChime('tick');
          }
          if (restRemainingSec === 0) {
            restRunning = false;
            clearInterval(restInterval);
            playChime('complete');
            showToast('Rest period complete! Ready for next station.', '⏱️');
            updateRestTimerUI();
          }
        }
      }, 1000);
    }

    function toggleRestTimer() {
      if (restRemainingSec <= 0) {
        resetRestTimer();
        return;
      }
      if (restRunning) {
        clearInterval(restInterval);
        restRunning = false;
      } else {
        startRestInterval();
      }
      updateRestTimerUI();
    }

    function resetRestTimer() {
      clearInterval(restInterval);
      restRemainingSec = restTotalSec;
      restRunning = false;
      updateRestTimerUI();
    }

    function stopRestTimer() {
      clearInterval(restInterval);
      restRunning = false;
      activeRestStepId = null;
    }

    function updateRestTimerUI() {
      const clockEl = document.getElementById('rest-clock-display');
      const statusEl = document.getElementById('rest-status-label');
      const btnEl = document.getElementById('btn-rest-toggle');
      const ringEl = document.getElementById('rest-progress-ring');

      if (clockEl) clockEl.textContent = formatSeconds(restRemainingSec);
      if (statusEl) {
        if (restRemainingSec === 0) {
          statusEl.textContent = 'RECOVERY COMPLETE — READY TO START';
          statusEl.className = 'text-xs font-extrabold uppercase tracking-widest text-emerald-400 mt-1';
        } else if (restRunning) {
          statusEl.textContent = 'COUNTING DOWN...';
          statusEl.className = 'text-xs font-extrabold uppercase tracking-widest text-cyan-400 mt-1';
        } else {
          statusEl.textContent = 'TIMER PAUSED';
          statusEl.className = 'text-xs font-extrabold uppercase tracking-widest text-amber-400 mt-1';
        }
      }
      if (btnEl) {
        btnEl.textContent = restRemainingSec === 0 ? 'Restart Timer' : (restRunning ? 'Pause Timer' : 'Resume Timer');
      }
      if (ringEl && restTotalSec > 0) {
        const circumference = 2 * Math.PI * 88;
        const pct = restRemainingSec / restTotalSec;
        ringEl.style.strokeDasharray = `${circumference}`;
        ringEl.style.strokeDashoffset = `${circumference * (1 - pct)}`;
      }
    }

    // =========================================================================
    // PLANK 180s LIVE STOPWATCH HELPER
    // =========================================================================
    function togglePlankGuideTimer() {
      if (plankGuideRunning) {
        clearInterval(plankGuideInterval);
        plankGuideRunning = false;
      } else {
        if (plankGuideElapsed >= 180) plankGuideElapsed = 0;
        plankGuideRunning = true;
        plankGuideInterval = setInterval(() => {
          plankGuideElapsed++;
          updatePlankGuideUI();
          if (plankGuideElapsed >= 180) {
            clearInterval(plankGuideInterval);
            plankGuideRunning = false;
            playChime('complete');
            state.plankSeconds = '180';
            state.plankStageReached = 'Stage 8 (Full 180s Completed)';
            saveState();
            const inputEl = document.getElementById('input-plankSeconds');
            if (inputEl) inputEl.value = '180';
            showToast('Full 180s Core Stability protocol complete!', '🏆');
            updatePlankGuideUI();
          }
        }, 1000);
      }
      updatePlankGuideUI();
    }

    function recordPlankStopNow() {
      clearInterval(plankGuideInterval);
      plankGuideRunning = false;
      const currentStageObj = PLANK_STAGES.find(s => plankGuideElapsed >= s.start && plankGuideElapsed < s.end) || PLANK_STAGES[PLANK_STAGES.length - 1];
      state.plankSeconds = String(plankGuideElapsed);
      if (plankGuideElapsed >= 180) {
        state.plankStageReached = 'Stage 8 (Full 180s Completed)';
      } else {
        const stageLabels = {
          1: 'Stage 1 (Start Position)',
          2: 'Stage 2 (Right Arm Extended)',
          3: 'Stage 3 (Left Arm Extended)',
          4: 'Stage 4 (Right Leg Extended)',
          5: 'Stage 5 (Left Leg Extended)',
          6: 'Stage 6 (Right Arm + Left Leg)',
          7: 'Stage 7 (Left Arm + Right Leg)',
          8: 'Stage 8 (Final Straight-Arm Hold)'
        };
        state.plankStageReached = stageLabels[currentStageObj.stage] || 'Stage 1 (Start Position)';
      }
      saveState();
      renderCurrentStep();
      showToast(`Logged ${plankGuideElapsed}s (${state.plankStageReached})`, '⏱️');
    }

    function resetPlankGuideTimer() {
      clearInterval(plankGuideInterval);
      plankGuideRunning = false;
      plankGuideElapsed = 0;
      updatePlankGuideUI();
    }

    function stopPlankGuideTimer() {
      clearInterval(plankGuideInterval);
      plankGuideRunning = false;
    }

    function updatePlankGuideUI() {
      const clockEl = document.getElementById('plank-guide-clock');
      const badgeEl = document.getElementById('plank-guide-stage-badge');
      const btnEl = document.getElementById('btn-plank-toggle');
      if (clockEl) clockEl.textContent = `${plankGuideElapsed}s / 180s`;
      if (btnEl) btnEl.textContent = plankGuideRunning ? 'Pause Stopwatch' : 'Start Live 180s Stopwatch';

      const activeStage = PLANK_STAGES.find(s => plankGuideElapsed >= s.start && plankGuideElapsed < s.end) || PLANK_STAGES[PLANK_STAGES.length - 1];
      if (badgeEl && activeStage) {
        badgeEl.textContent = `Stage ${activeStage.stage}: ${activeStage.title}`;
      }

      PLANK_STAGES.forEach(s => {
        const row = document.getElementById(`plank-stage-row-${s.stage}`);
        if (!row) return;
        if (activeStage && s.stage === activeStage.stage && plankGuideElapsed > 0) {
          row.className = 'p-2.5 rounded-xl border bg-cyan-500/15 border-cyan-400 text-white transition';
        } else {
          row.className = 'p-2.5 rounded-xl border bg-navy-950/60 border-navy-800 text-slate-300 transition';
        }
      });
    }

    function updateChrome(steps, idx, step) {
      const badge = document.getElementById('step-counter-badge');
      const subtitle = document.getElementById('header-subtitle');
      const progressBar = document.getElementById('progress-bar');
      const drawerList = document.getElementById('step-drawer-list');
      const prevBtn = document.getElementById('btn-prev');
      const nextBtn = document.getElementById('btn-next');
      const nextLabel = document.getElementById('btn-next-label');
      const bottomNav = document.getElementById('bottom-nav');

      if (badge) badge.textContent = `Step ${idx + 1}/${steps.length}`;
      if (subtitle) subtitle.textContent = step.title;
      if (progressBar) {
        const pct = Math.round(((idx + 1) / steps.length) * 100);
        progressBar.style.width = `${pct}%`;
      }

      if (drawerList) {
        drawerList.innerHTML = steps.map((s, i) => {
          const isCurrent = s.id === step.id;
          const isDone = !!state.completedSteps[s.id];
          return `
            <button type="button" onclick="jumpToStep('${s.id}')"
              class="text-left px-3 py-2 rounded-xl text-xs font-semibold flex items-center justify-between border transition ${
                isCurrent
                  ? 'bg-cyan-500/20 border-cyan-400 text-white'
                  : 'bg-navy-950/70 border-navy-800 text-slate-300 hover:border-navy-600'
              }">
              <span class="truncate">${s.shortTitle}</span>
              <span class="ml-2 shrink-0 text-[10px] font-mono ${isDone ? 'text-emerald-400' : 'text-slate-500'}">
                ${isCurrent ? 'ACTIVE' : (isDone ? '✓' : `#${i + 1}`)}
              </span>
            </button>
          `;
        }).join('');
      }

      if (prevBtn) prevBtn.disabled = idx === 0;

      if (bottomNav && nextBtn && nextLabel) {
        if (step.id === 'summary' || step.id === 'optionalPrompt') {
          nextBtn.classList.add('hidden');
        } else {
          nextBtn.classList.remove('hidden');
          if (step.type === 'rest') {
            nextLabel.textContent = 'Start Next Station';
          } else if (step.id === 'step0') {
            nextLabel.textContent = 'Start Evaluation';
          } else {
            nextLabel.textContent = 'Complete & Continue';
          }
        }
      }
    }

    // =========================================================================
    // MAIN STEP RENDERER
    // =========================================================================
    function renderCurrentStep() {
      const steps = getSteps();
      let idx = steps.findIndex(s => s.id === state.currentStepId);
      if (idx === -1) {
        idx = 0;
        state.currentStepId = steps[0].id;
      }
      const step = steps[idx];
      updateChrome(steps, idx, step);

      const container = document.getElementById('wizard-container');
      if (!container) return;

      // -----------------------------------------------------------------------
      // REST / RECOVERY COUNTDOWN SCREENS
      // -----------------------------------------------------------------------
      if (step.type === 'rest') {
        initRestTimerForStep(step);
        const circumference = 2 * Math.PI * 88;
        const pct = restTotalSec > 0 ? restRemainingSec / restTotalSec : 0;
        const dashOffset = circumference * (1 - pct);

        container.innerHTML = `
          <div class="bg-navy-900 border border-cyan-500/40 rounded-3xl p-6 sm:p-8 text-center shadow-2xl">
            <span class="inline-block px-3 py-1 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-400 text-xs font-extrabold uppercase tracking-wider mb-2">

                <circle id="rest-progress-ring" cx="100" cy="100" r="88" stroke="#22D3EE" stroke-width="10" stroke-linecap="round" fill="none"
                  style="stroke-dasharray: ${circumference}; stroke-dashoffset: ${dashOffset}; transition: stroke-dashoffset 0.5s linear;" />
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <span id="rest-clock-display" class="font-mono text-4xl sm:text-5xl font-extrabold text-white tracking-tight">${formatSeconds(restRemainingSec)}</span>
                <span id="rest-status-label" class="text-[10px] font-extrabold uppercase tracking-widest text-cyan-400 mt-1">
                  ${restRemainingSec === 0 ? 'RECOVERY COMPLETE' : (restRunning ? 'COUNTING DOWN...' : 'TIMER PAUSED')}
                </span>
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-3 mb-7">
              <button id="btn-rest-toggle" type="button" onclick="toggleRestTimer()"
                class="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-navy-950 font-extrabold text-xs sm:text-sm transition">
                ${restRemainingSec === 0 ? 'Restart Timer' : (restRunning ? 'Pause Timer' : 'Resume Timer')}
              </button>
              <button type="button" onclick="resetRestTimer()"

                Reset (${Math.round(step.durationSec / 60)}')
              </button>
            </div>

            <!-- Next Station Preparation Checklist -->
            <div class="text-left bg-navy-950/90 border border-navy-800 rounded-2xl p-4 sm:p-5">
              <div class="text-xs font-extrabold uppercase tracking-wider text-teal-400 mb-2">Preparation Checklist Before Next Station</div>
              <ul class="space-y-2 text-xs sm:text-sm text-slate-300 list-disc pl-5">
                ${step.prepChecklist.map(item => `<li>${item}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
        return;
      }

      // -----------------------------------------------------------------------
      // STEP 0: ATHLETE PROFILE & READINESS
      // -----------------------------------------------------------------------
      if (step.id === 'step0') {
        const activeUrl = getActiveGoogleScriptUrl();
        container.innerHTML = `
          <div class="mb-5">
            <span class="text-xs font-extrabold uppercase tracking-wider text-cyan-400">${step.badge}</span>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white mt-0.5">${step.title}</h2>
            <p class="text-sm text-slate-400 mt-1">Enter athlete baseline data before beginning benchmarking activities.</p>
          </div>

          ${!GOOGLE_SCRIPT_URL ? `
            <details class="mb-5 bg-navy-900/90 border ${activeUrl ? 'border-emerald-500/40' : 'border-navy-700'} rounded-2xl p-4">
              <summary class="cursor-pointer text-xs font-extrabold uppercase tracking-wider flex items-center justify-between ${activeUrl ? 'text-emerald-400' : 'text-slate-300'} select-none">
                <span>⚙️ Coach Setup: Google Sheet Endpoint (${activeUrl ? 'Connected' : 'Optional'})</span>
                <span class="text-[11px] font-normal text-slate-400">Tap to configure</span>
              </summary>
              <div class="mt-3 pt-3 border-t border-navy-800 space-y-2.5 text-xs text-slate-300">
                <p>Paste your deployed Google Apps Script Web App URL below (or share this page with <code class="text-cyan-400">?sheetUrl=YOUR_URL</code>) to enable one-click submission to your Google Sheet:</p>
                <div class="flex flex-col sm:flex-row gap-2">
                  <input id="input-coach-sheet-url-step0" type="url" value="${escapeHtml(activeUrl)}"
                    placeholder="https://script.google.com/macros/s/.../exec"

              ${summaryRow('Core Stability (Straight-Arm Plank)', state.plankSeconds !== '' ? `${state.plankSeconds} sec` : '—', state.plankStageReached)}
            </div>
          </div>

          <!-- Optional Stations Results Table (if included or data entered) -->
          ${(state.includeOptional || state.optBench120Reps || state.optBenchPullReps) ? `
            <div class="bg-navy-900 border border-navy-700/80 rounded-2xl overflow-hidden mb-6 print-card">
              <div class="px-4 py-3 bg-navy-800/80 border-b border-navy-700">
                <h3 class="text-xs font-extrabold uppercase tracking-wider text-teal-400 print-text-dark">Optional Assessments (Evaluations #2 & #3)</h3>
              </div>
              <div class="divide-y divide-navy-800 print-border text-xs sm:text-sm">
                ${summaryRow('Bench Press Max Rep (120 lbs)', state.optBench120Reps !== '' ? `${state.optBench120Reps} reps @ ${state.optBench120Load} lbs` : '—', 'Standard 120 lb benchmark')}
                ${summaryRow('Bench Pull Max Rep (50% BW)', state.optBenchPullReps !== '' ? `${state.optBenchPullReps} reps @ ${state.optBenchPullLoad || '—'} lbs` : '—', `Target 50% BW (nearest 5#): ${w50 ? w50 + ' lbs' : '—'}`)}
              </div>
            </div>
          ` : ''}

          <!-- 6-Minute Personal Erg Test Section (Within 7 Days) -->
          <div class="bg-navy-900 border border-cyan-500/30 rounded-2xl p-4 sm:p-6 mb-6 print-card">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <span class="text-[11px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-cyan-500/15 text-cyan-400 border border-cyan-500/30">Personal Assessment • Within 7 Days</span>
                <h3 class="text-lg font-extrabold text-white print-text-dark mt-1.5">6-Minute Rowing Ergometer Test</h3>
              </div>
            </div>

            <div class="text-xs text-slate-300 space-y-1 mb-4 bg-navy-950/70 p-3.5 rounded-xl border border-navy-800 no-print">
              <p><strong class="text-cyan-400">Protocol:</strong> Damper resistance <strong>3–5</strong> • Clean rail • Single timed workout for <strong>6 minutes with 2' splits</strong> (record Borg 1–20 effort & distance at 2', 4', and Finish).</p>
              <p><strong class="text-teal-400">Submission:</strong> Take a picture of the ergometer memory screen and email results to the Coach & CC Co-Captain within 7 days.</p>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3">
              <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1">2' Effort (1–20)</label>
                <input type="number" min="1" max="20" value="${escapeHtml(state.erg6Min2Effort)}" oninput="updateField('erg6Min2Effort', this.value)"
                  placeholder="1-20" class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-navy-700 text-white font-mono text-xs font-bold" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1">2' Distance (m)</label>
                <input type="number" value="${escapeHtml(state.erg6Min2Dist)}" oninput="updateField('erg6Min2Dist', this.value)"
                  placeholder="Meters" class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-navy-700 text-white font-mono text-xs font-bold" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1">4' Effort (1–20)</label>
                <input type="number" min="1" max="20" value="${escapeHtml(state.erg6Min4Effort)}" oninput="updateField('erg6Min4Effort', this.value)"
                  placeholder="1-20" class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-navy-700 text-white font-mono text-xs font-bold" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1">4' Distance (m)</label>
                <input type="number" value="${escapeHtml(state.erg6Min4Dist)}" oninput="updateField('erg6Min4Dist', this.value)"
                  placeholder="Meters" class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-navy-700 text-white font-mono text-xs font-bold" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1">Finish Effort (1–20)</label>
                <input type="number" min="1" max="20" value="${escapeHtml(state.erg6FinishEffort)}" oninput="updateField('erg6FinishEffort', this.value)"
                  placeholder="1-20" class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-navy-700 text-white font-mono text-xs font-bold" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1">Final Split Dist (m)</label>
                <input type="number" value="${escapeHtml(state.erg6FinalSplitDist)}" oninput="updateField('erg6FinalSplitDist', this.value)"
                  placeholder="Meters" class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-navy-700 text-white font-mono text-xs font-bold" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-cyan-400 mb-1">Total 6' Dist (m)</label>
                <input id="input-erg6TotalDist" type="number" value="${escapeHtml(state.erg6TotalDist)}" oninput="updateField('erg6TotalDist', this.value); refresh6MinRel();"
                  placeholder="Meters" class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-cyan-500/50 text-white font-mono text-xs font-extrabold" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-rose-400 mb-1">Finished HR (BPM)</label>
                <input type="number" value="${escapeHtml(state.erg6FinishHR)}" oninput="updateField('erg6FinishHR', this.value)"
                  placeholder="BPM" class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-navy-700 text-white font-mono text-xs font-bold" />
              </div>
            </div>

            <div class="flex items-center justify-between pt-2.5 border-t border-navy-800 text-xs">
              <span class="text-slate-400">6-Minute BW Relative Row Erg Distance:</span>
              <strong id="rel-6min-display" class="font-mono text-cyan-400 print-text-dark">${rel6Min}</strong>
            </div>
          </div>
        `;
        return;
      }
    }

    function summaryRow(label, value, subtext) {
      return `
        <div class="px-4 py-3 flex items-center justify-between gap-4">
          <div>
            <div class="font-bold text-slate-200 print-text-dark">${label}</div>
            ${subtext ? `<div class="text-[11px] text-slate-400">${subtext}</div>` : ''}
          </div>
          <div class="font-mono font-extrabold text-right text-cyan-400 print-text-dark shrink-0">${value}</div>
        </div>
      `;
    }

    // =========================================================================
    // INTERACTIVE HELPERS FOR STEP 0 & SUMMARY
    // =========================================================================
    function setWeightUnit(unit) {
      state.weightUnit = unit;
      saveState();
      renderCurrentStep();
    }

    function refreshTargetPreviews() {
      const box = document.getElementById('bw-target-preview');
      if (!box) return;
      box.innerHTML = `
        <div class="bg-navy-950/90 border border-navy-800 rounded-xl px-3 py-2 flex items-center justify-between">
          <span class="text-xs text-slate-400">50% BW (Bench Press/Pull)</span>
          <span class="text-xs font-mono font-bold text-cyan-400">${getTargetWeight(50) ? getTargetWeight(50) + ' lbs' : '—'}</span>
        </div>
        <div class="bg-navy-950/90 border border-navy-800 rounded-xl px-3 py-2 flex items-center justify-between">
          <span class="text-xs text-slate-400">25% BW (One-Arm DB Row)</span>
          <span class="text-xs font-mono font-bold text-cyan-400">${getTargetWeight(25) ? getTargetWeight(25) + ' lbs' : '—'}</span>
        </div>
      `;
    }

    function setRating(field, val) {
      state[field] = val;
      saveState();
      renderCurrentStep();
    }

    function refresh6MinRel() {
      const el = document.getElementById('rel-6min-display');
      if (el) el.textContent = getRelativeErgDistance(state.erg6TotalDist);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // =========================================================================
    // GOOGLE SHEETS SUBMISSION HANDLER
    // =========================================================================
    function buildGoogleSheetPayload() {
      return {
        timestamp: new Date().toISOString(),
        athleteName: (state.athleteName || '').trim(),
        signature: (state.signature || '').trim(),
        ageCategory: state.ageCategory || '',
        bodyWeight: state.bodyWeight || '',
        weightUnit: state.weightUnit || 'lbs',
        restingHR: state.morningRHR || '',
        sleepQuantity: state.sleepQuantity ?? '',
        sleepQuality: state.sleepQuality ?? '',
        sitAndReachCm: state.sitReachBest || '',
        erg2MinTotalDist: state.row2TotalDist || '',
        erg2Min1mRpe: state.row2Min1Effort || '',
        erg2Min1mDist: state.row2Min1Dist || '',
        erg2MinFinishRpe: state.row2FinishEffort || '',
        erg2Min2ndSplitDist: state.row2Split2Dist || '',
        erg2MinFinishHR: state.row2FinishHR || '',
        erg2MinBwRelDist: getRelativeErgMetersOnly(state.row2TotalDist),
        pullUpsReps: state.pullUpReps ?? '',
        pullUpsBand: state.pullUpBand || '',
        bench50Load: state.bench50Load || '',
        bench50Reps: state.bench50Reps ?? '',
        rowLeftLoad: state.dbRowLeftLoad || '',
        rowLeftReps: state.dbRowLeftReps ?? '',
        rowRightLoad: state.dbRowRightLoad || '',
        rowRightReps: state.dbRowRightReps ?? '',
        plankSec: state.plankSeconds ?? '',
        optBench120Load: state.optBench120Load || '',
        optBench120Reps: state.optBench120Reps ?? '',
        optBenchPullLoad: state.optBenchPullLoad || '',
        optBenchPullReps: state.optBenchPullReps ?? '',
        erg6MinTotalDist: state.erg6TotalDist || '',
        erg6Min2mRpe: state.erg6Min2Effort || '',
        erg6Min2mDist: state.erg6Min2Dist || '',
        erg6Min4mRpe: state.erg6Min4Effort || '',
        erg6Min4mDist: state.erg6Min4Dist || '',
        erg6MinFinishRpe: state.erg6FinishEffort || '',
        erg6MinFinalSplitDist: state.erg6FinalSplitDist || '',
        erg6MinFinishHR: state.erg6FinishHR || '',
        erg6MinBwRelDist: getRelativeErgMetersOnly(state.erg6TotalDist)
      };
    }

    function setSheetFeedback(type, message) {
      const box = document.getElementById('sheet-submit-feedback');
      if (!box) return;
      box.classList.remove('hidden');
      if (type === 'success') {
        box.innerHTML = `
          <div class="p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-semibold flex items-start gap-2">
            <span class="shrink-0">✅</span>
            <span>${escapeHtml(message)}</span>
          </div>
        `;
      } else {
        box.innerHTML = `
          <div class="p-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-200 text-xs font-medium flex items-start gap-2">
            <span class="shrink-0">⚠️</span>
            <span>${escapeHtml(message)} Your local browser backup is intact—you can also use <strong>Download CSV</strong> or <strong>Copy Results</strong> below.</span>
          </div>
        `;
      }
    }

    async function submitToGoogleSheet() {
      if (isSubmittingToSheet) return;

      // Validate required baseline field
      if (!state.athleteName || !state.athleteName.trim()) {
        showToast('Please enter Athlete Name in Step 0 before submitting.', '⚠️');
        setSheetFeedback('error', 'Missing Athlete Name: Please return to Step 0 to enter your name before submitting.');
        return;
      }

      const endpointUrl = getActiveGoogleScriptUrl();
      if (!endpointUrl) {
        showToast('Google Sheet Web App URL is not configured yet.', '⚠️');
        setSheetFeedback('error', 'No Google Sheet Web App URL is configured. Ask your coach for the link or paste the Apps Script Web App URL in Coach Setup above.');
        return;
      }

      isSubmittingToSheet = true;
      renderCurrentStep();

      const payload = buildGoogleSheetPayload();

      try {
        // Google Apps Script Web Apps redirect POST responses to googleusercontent.com,
        // which can trigger a browser CORS "Failed to fetch" even after the row is written.
        // Using mode: 'no-cors' sends the JSON payload cleanly and succeeds reliably.
        await fetch(endpointUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const formattedTime = new Date().toLocaleString();
        state.lastSheetSubmission = formattedTime;
        saveState();
        isSubmittingToSheet = false;
        renderCurrentStep();
        setSheetFeedback('success', `Results sent to Coach's Google Sheet! (${formattedTime})`);
        showToast('Submitted to Coach\'s Google Sheet!', '✅');
      } catch (err) {
        console.error('Google Sheet submission error:', err);
        isSubmittingToSheet = false;
        renderCurrentStep();
        setSheetFeedback('error', `Could not reach Google Sheet (${err.message || 'Network error'}).`);
        showToast('Submission failed — check connection or URL.', '⚠️');
      }
    }

    // =========================================================================
    // EXPORT FUNCTIONS (CLIPBOARD & CSV)
    // =========================================================================
    function buildSummaryPlainText() {
      const u = state.weightUnit;
      const lines = [
        'BARRACUDA FITNESS EVALUATION 2025-26 RESULTS',
        `Date: ${new Date().toLocaleDateString()}`,
        `Athlete: ${state.athleteName || 'N/A'} | Category: ${state.ageCategory}`,
        `Body Weight: ${state.bodyWeight || 'N/A'} ${u} | Morning RHR: ${state.morningRHR || 'N/A'} BPM`,
        `Sleep Quantity: ${state.sleepQuantity}/10 | Sleep Quality: ${state.sleepQuality}/10`,
        '--------------------------------------------------',
        `1. Sit & Reach (Best of 3): ${state.sitReachBest || 'N/A'} cm (Trials: ${state.sitReachTrial1 || '-'}, ${state.sitReachTrial2 || '-'}, ${state.sitReachTrial3 || '-'})`,
        `2. 2-Min Row Erg: ${state.row2TotalDist || 'N/A'} m | 1' Dist: ${state.row2Min1Dist || '-'} m (Borg ${state.row2Min1Effort || '-'}) | 2nd Split: ${state.row2Split2Dist || '-'} m (Borg ${state.row2FinishEffort || '-'}) | Finish HR: ${state.row2FinishHR || '-'} BPM`,
        `   2-Min BW Relative Distance: ${getRelativeErgDistance(state.row2TotalDist)}`,
        `3. Dead Hang Pull-Ups: ${state.pullUpReps || 'N/A'} reps (Band: ${state.pullUpBand})`,
        `4. Max Rep Bench Press (50% BW): ${state.bench50Reps || 'N/A'} reps @ ${state.bench50Load || 'N/A'} lbs`,
        `5A. 1' One-Arm DB Row Left (25% BW): ${state.dbRowLeftReps || 'N/A'} reps @ ${state.dbRowLeftLoad || 'N/A'} lbs`,
        `5B. 1' One-Arm DB Row Right (25% BW): ${state.dbRowRightReps || 'N/A'} reps @ ${state.dbRowRightLoad || 'N/A'} lbs`,
        `6. Core Stability (Straight-Arm Plank): ${state.plankSeconds || 'N/A'} sec (${state.plankStageReached})`
      ];

      if (state.includeOptional || state.optBench120Reps || state.optBenchPullReps) {
        lines.push(
          '--- Optional Assessments (Evals #2 & #3) ---',
          `8. Bench Press (120 lbs): ${state.optBench120Reps || 'N/A'} reps @ ${state.optBench120Load} lbs`,
          `9. Bench Pull (50% BW): ${state.optBenchPullReps || 'N/A'} reps @ ${state.optBenchPullLoad || 'N/A'} lbs`
        );
      }

      if (state.erg6TotalDist) {
        lines.push(
          '--- 6-Minute Personal Row Erg ---',
          `Total Distance: ${state.erg6TotalDist} m | 2': ${state.erg6Min2Dist || '-'}m (RPE ${state.erg6Min2Effort || '-'}) | 4': ${state.erg6Min4Dist || '-'}m (RPE ${state.erg6Min4Effort || '-'}) | Finish Split: ${state.erg6FinalSplitDist || '-'}m (RPE ${state.erg6FinishEffort || '-'}) | HR: ${state.erg6FinishHR || '-'} BPM`,
          `6-Min BW Relative Distance: ${getRelativeErgDistance(state.erg6TotalDist)}`
        );
      }

      return lines.join('\n');
    }

    function copyResultsToClipboard() {
      const text = buildSummaryPlainText();
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Results copied to clipboard!', '📋');
      } catch (err) {
        showToast('Unable to copy automatically.', '⚠️');
      }
      document.body.removeChild(textarea);
    }

    function downloadCSV() {
      const rows = [
        ['Field', 'Value', 'Unit / Notes'],
        ['Athlete Name', state.athleteName, ''],
        ['Age Category', state.ageCategory, ''],
        ['Body Weight', state.bodyWeight, state.weightUnit],
        ['Morning Resting HR', state.morningRHR, 'BPM'],
        ['Sleep Quantity', state.sleepQuantity, '1-10'],
        ['Sleep Quality', state.sleepQuality, '1-10'],
        ['Sit & Reach Best', state.sitReachBest, 'cm'],
        ['2-Min Row Erg Total Distance', state.row2TotalDist, 'meters'],
        ['2-Min Row 1-Min Effort', state.row2Min1Effort, 'Borg 1-20'],
        ['2-Min Row 1-Min Distance', state.row2Min1Dist, 'meters'],
        ['2-Min Row Finish Effort', state.row2FinishEffort, 'Borg 1-20'],
        ['2-Min Row 2nd Split Distance', state.row2Split2Dist, 'meters'],
        ['2-Min Row Finish HR', state.row2FinishHR, 'BPM'],
        ['2-Min BW Relative Row Distance', getRelativeErgDistance(state.row2TotalDist), ''],
        ['Dead Hang Pull-Ups Reps', state.pullUpReps, state.pullUpBand],
        ['Bench Press 50% BW Load', state.bench50Load, 'lbs'],
        ['Bench Press 50% BW Reps', state.bench50Reps, 'reps'],
        ['1-Min DB Row Left Load', state.dbRowLeftLoad, 'lbs'],
        ['1-Min DB Row Left Reps', state.dbRowLeftReps, 'reps'],
        ['1-Min DB Row Right Load', state.dbRowRightLoad, 'lbs'],
        ['1-Min DB Row Right Reps', state.dbRowRightReps, 'reps'],
        ['Core Stability Plank Time', state.plankSeconds, 'seconds'],
        ['Core Stability Stage', state.plankStageReached, ''],
        ['Optional Bench Press 120lb Load', state.optBench120Load, 'lbs'],
        ['Optional Bench Press 120lb Reps', state.optBench120Reps, 'reps'],
        ['Optional Bench Pull 50% BW Load', state.optBenchPullLoad, 'lbs'],
        ['Optional Bench Pull 50% BW Reps', state.optBenchPullReps, 'reps'],
        ['6-Min Row Erg Total Distance', state.erg6TotalDist, 'meters'],
        ['6-Min Row 2-Min Effort', state.erg6Min2Effort, 'Borg 1-20'],
        ['6-Min Row 2-Min Distance', state.erg6Min2Dist, 'meters'],
        ['6-Min Row 4-Min Effort', state.erg6Min4Effort, 'Borg 1-20'],
        ['6-Min Row 4-Min Distance', state.erg6Min4Dist, 'meters'],
        ['6-Min Row Finish Effort', state.erg6FinishEffort, 'Borg 1-20'],
        ['6-Min Row Final Split Distance', state.erg6FinalSplitDist, 'meters'],
        ['6-Min Row Finish HR', state.erg6FinishHR, 'BPM']
      ];

      const csvContent = rows
        .map(r => r.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const safeName = (state.athleteName || 'Athlete').replace(/[^a-z0-9]/gi, '_');
      link.href = url;
      link.download = `BARRACUDA_Eval_2025_26_${safeName}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('CSV file downloaded!', '📥');
    }

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      updateSoundIcons();
      renderCurrentStep();
    });
  </script>
</body>
