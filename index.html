<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BARRACUDA DRACONA Fitness Evaluation 2026-2027</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            navy: {
              950: '#040914',
              900: '#081226',
              800: '#0F1E3A',
              700: '#182D54',
            },
            barracuda: {
              400: '#22D3EE',
              500: '#06B6D4',
              600: '#0891B2',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #040914;
      color: #F8FAFC;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom scrollbar for sleek look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #081226;
    }
    ::-webkit-scrollbar-thumb {
      background: #182D54;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #A855F7;
    }
    /* Print stylesheet for clean PDF export */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-card {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        color: #000000 !important;
        box-shadow: none !important;
      }
      .print-text-dark {
        color: #0f172a !important;
      }
      .print-border {
        border-color: #cbd5e1 !important;
      }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    .timer-glow {
      animation: pulse-ring 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-navy-950 text-slate-100 antialiased selection:bg-purple-500 selection:text-white">

  <!-- Top Sticky Header & Progress Bar -->
  <header class="sticky top-0 z-40 bg-navy-900/95 backdrop-blur-md border-b border-navy-700/80 shadow-lg no-print">
    <div class="max-w-3xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-400 to-fuchsia-600 flex items-center justify-center text-white text-lg font-extrabold shadow-md shadow-purple-500/25">
            🐉
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-white">BARRACUDA DRACONA</h1>
              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-purple-500/15 text-purple-300 border border-purple-500/30">2026–27 Eval</span>
            </div>
            <p id="header-subtitle" class="text-xs text-slate-400 truncate max-w-[200px] sm:max-w-xs">Fitness Evaluation Protocol</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Sound Toggle -->
          <button id="btn-sound-toggle" type="button" onclick="toggleSound()" title="Toggle Timer Chime" class="p-2 rounded-xl bg-navy-800 hover:bg-navy-700 border border-navy-700 text-purple-300 transition">
            <svg id="icon-sound-on" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            </svg>
            <svg id="icon-sound-off" class="w-4 h-4 hidden text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="w-full h-2 bg-navy-950 rounded-full overflow-hidden border border-navy-800">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-purple-500 to-fuchsia-400 transition-all duration-300 rounded-full" style="width: 10%;"></div>
      </div>
    </div>
  </header>

  <!-- Toast / Message Banner (No alert() used anywhere) -->
  <div id="toast-container" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 translate-y-4">
    <div id="toast-box" class="px-4 py-2.5 rounded-2xl bg-navy-800 border border-purple-500/50 text-white text-sm font-medium shadow-xl flex items-center gap-2">
      <span id="toast-icon" class="text-purple-300">✓</span>
      <span id="toast-msg">Saved</span>
    </div>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-navy-950/80 backdrop-blur-sm p-4 no-print">
    <div class="bg-navy-900 border border-navy-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
      <h3 id="confirm-title" class="text-lg font-bold text-white mb-2">Confirm Action</h3>
      <p id="confirm-text" class="text-sm text-slate-300 mb-5">Are you sure?</p>
      <div class="flex justify-end gap-2.5">
        <button type="button" onclick="closeConfirmModal()" class="px-4 py-2 rounded-xl bg-navy-800 hover:bg-navy-700 text-slate-300 text-sm font-semibold transition">Cancel</button>
        <button id="confirm-yes-btn" type="button" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold transition">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 pb-28">
    <div id="wizard-container"></div>
  </main>

  <!-- Sticky Bottom Navigation Footer -->
  <footer id="bottom-nav" class="fixed bottom-0 inset-x-0 z-30 bg-navy-900/95 backdrop-blur-md border-t border-navy-700/80 px-4 py-3 no-print">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
      <button id="btn-prev" type="button" onclick="prevStep()" class="px-4 py-3 rounded-xl bg-navy-800 hover:bg-navy-700 disabled:opacity-40 disabled:pointer-events-none text-slate-200 font-semibold text-sm flex items-center gap-1.5 border border-navy-700 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        <span>Back</span>
      </button>

      <div class="text-center hidden sm:block">
        <span id="autosave-indicator" class="text-xs text-slate-400 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
          Auto-saved locally
        </span>
      </div>

      <button id="btn-next" type="button" onclick="nextStep()" class="flex-1 sm:flex-initial sm:min-w-[210px] px-5 py-3 rounded-xl bg-gradient-to-r from-purple-500 to-fuchsia-500 hover:from-purple-400 hover:to-fuchsia-400 text-white font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg shadow-purple-500/25 transition">
        <span id="btn-next-label">Continue</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </footer>

  <script>
    // =========================================================================
    // COACH CONFIGURATION: GOOGLE APPS SCRIPT WEB APP URL
    // Paste your deployed Google Apps Script Web App URL between the quotes below
    // (e.g., "https://script.google.com/macros/s/AKfycbx.../exec")
    // =========================================================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA7ZRC1ld1noJfYgOFwsu0PsSfS49fDT9WtMkm8CdF_1rXUryC8gbjDaxTtvjTvQOv/exec";

    // =========================================================================
    // STATE & DATA MODEL
    // =========================================================================
    const STORAGE_KEY = 'barracuda_dracona_eval_2026_2027_v1';
    const SHEET_URL_OVERRIDE_KEY = 'barracuda_dracona_sheet_url_override_v1';

    const defaultData = {
      currentStepId: 'entryChoice',
      submissionType: 'Full Evaluation',
      evalDate: new Date().toISOString().slice(0, 10),
      erg6Date: new Date().toISOString().slice(0, 10),
      athleteName: '',
      signature: '',
      ageCategory: 'Premier',
      bodyWeight: '',
      weightUnit: 'lbs',
      morningRHR: '',
      sleepQuantity: 7,
      sleepQuality: 7,
      safetyAck: false,
      // Step 1: Sit & Reach
      sitReachTrial1: '',
      sitReachTrial2: '',
      sitReachTrial3: '',
      sitReachBest: '',
      // Step 2: 2-Min Row Erg
      row2Min1Effort: '',
      row2Min1Dist: '',
      row2FinishEffort: '',
      row2Split2Dist: '',
      row2TotalDist: '',
      row2FinishHR: '',
      // Step 3: Pull Ups
      pullUpReps: '',
      pullUpBand: 'None (Bodyweight)',
      // Step 4: Bench Press 50% BW
      bench50Load: '',
      bench50Reps: '',
      // Step 5: One-Arm DB Row Left
      dbRowLeftLoad: '',
      dbRowLeftReps: '',
      // Step 6: One-Arm DB Row Right
      dbRowRightLoad: '',
      dbRowRightReps: '',
      // Step 7: Core Stability Plank
      plankSeconds: '',
      plankStageReached: 'Stage 8 (Full 180s Completed)',
      // Optional stations toggle & data
      includeOptional: false,
      optBench120Load: '120',
      optBench120Reps: '',
      optBenchPullLoad: '',
      optBenchPullReps: '',
      // 6-Min Personal Row Erg
      erg6TotalDist: '',
      erg6Min2Effort: '',
      erg6Min2Dist: '',
      erg6Min4Effort: '',
      erg6Min4Dist: '',
      erg6FinishEffort: '',
      erg6FinalSplitDist: '',
      erg6FinishHR: '',
      // Track completed steps & sheet submission status
      completedSteps: {},
      lastSheetSubmission: ''
    };

    let state = loadState();
    let isSubmittingToSheet = false;
    let soundEnabled = true;
    // Session-only preview & base64 data for optional 6-minute erg screen photo
    let erg6PhotoPreviewUrl = '';
    let erg6PhotoFileName = '';
    let erg6PhotoBase64 = '';

    // Rest timer state
    let restInterval = null;
    let restRemainingSec = 0;
    let restTotalSec = 0;
    let restRunning = false;

    // Plank 8-stage helper stopwatch state
    let plankGuideInterval = null;
    let plankGuideElapsed = 0;
    let plankGuideRunning = false;

    const PLANK_STAGES = [
      { stage: 1, start: 0, end: 15, dur: 15, title: 'Start Position', desc: 'Straight-arm plank hold with hands under shoulders, hips level, neck neutral.' },
      { stage: 2, start: 15, end: 30, dur: 15, title: 'Right Arm Lift', desc: 'Lift right arm off the floor / hold straight-arm plank progression.' },
      { stage: 3, start: 30, end: 45, dur: 15, title: 'Left Arm Lift', desc: 'Lift left arm off the floor / hold straight-arm plank progression.' },
      { stage: 4, start: 45, end: 60, dur: 15, title: 'Right Leg Lift', desc: 'Lift right leg off the floor while keeping hips square and arms straight.' },
      { stage: 5, start: 60, end: 90, dur: 30, title: 'Left Leg Lift', desc: 'Lift left leg off the floor for 30 seconds while keeping hips level.' },
      { stage: 6, start: 90, end: 120, dur: 30, title: 'Right Arm + Left Leg Lift', desc: 'Opposite arm and leg raise held for 30 seconds on straight supporting arm.' },
      { stage: 7, start: 120, end: 150, dur: 30, title: 'Left Arm + Right Leg Lift', desc: 'Opposite arm and leg raise held for 30 seconds on straight supporting arm.' },
      { stage: 8, start: 150, end: 180, dur: 30, title: 'Final Straight-Arm Hold', desc: 'Return all limbs to straight-arm plank and hold through 180 seconds.' }
    ];

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...defaultData };
        const parsed = JSON.parse(raw);
        return {
          ...defaultData,
          ...parsed,
          evalDate: parsed.evalDate || new Date().toISOString().slice(0, 10),
          erg6Date: parsed.erg6Date || new Date().toISOString().slice(0, 10)
        };
      } catch (err) {
        console.warn('Could not load saved state:', err);
        return { ...defaultData };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        const ind = document.getElementById('autosave-indicator');
        if (ind) {
          ind.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span> Saved ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        }
      } catch (err) {
        console.warn('Could not save state:', err);
      }
    }

    function getActiveGoogleScriptUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        const paramUrl = params.get('sheetUrl');
        if (paramUrl && paramUrl.trim()) {
          return paramUrl.trim();
        }
      } catch (err) {
        console.warn('URL param check failed:', err);
      }
      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.trim()) {
        return GOOGLE_SCRIPT_URL.trim();
      }
      try {
        const savedOverride = localStorage.getItem(SHEET_URL_OVERRIDE_KEY);
        if (savedOverride && savedOverride.trim()) {
          return savedOverride.trim();
        }
      } catch (err) {
        console.warn('Sheet URL override read failed:', err);
      }
      return '';
    }

    function getSteps() {
      const steps = [
        { id: 'entryChoice', type: 'form', badge: 'Start Here', title: 'Select Evaluation Path', shortTitle: 'Start' },
        { id: 'step0', type: 'form', badge: 'Pre-Test Readiness', title: 'Athlete Profile & Readiness', shortTitle: 'Profile & Readiness' },
        { id: 'step1', type: 'form', badge: 'Station 1 • Flexibility', title: 'Sit & Reach Test', shortTitle: '1. Sit & Reach' },
        { id: 'step2', type: 'form', badge: 'Station 2 • Aerobic / Anaerobic', title: '2-Minute Rowing Ergometer', shortTitle: '2. 2-Min Row Erg' },
        {
          id: 'rest_after_row2',
          type: 'rest',
          badge: 'Mandatory Recovery',
          title: '15-Minute Rest Period',
          shortTitle: 'Rest: 15 Min',
          durationSec: 15 * 60,
          nextStationTitle: 'Station 3: Dead Hang Pull-Ups',
          protocolNotes: [
            'Use this 15-minute window to hydrate, walk lightly, and shake out forearms.',
            'Prepare chalk or resistance band if needed for Station 3 (Dead Hang Pull-Ups).'
          ]
        },
        { id: 'step3', type: 'form', badge: 'Station 3 • Upper Body Pull', title: 'Dead Hang Pull-Ups', shortTitle: '3. Pull-Ups' },
        {
          id: 'rest_after_pullup',
          type: 'rest',
          badge: 'Mandatory Recovery',
          title: '5-Minute Rest Period',
          shortTitle: 'Rest: 5 Min',
          durationSec: 5 * 60,
          nextStationTitle: 'Station 4: Bench Press Max Rep (50% BW)',
          protocolNotes: [
            'Rest 5 minutes between Pull-Ups and Bench Press.',
            'Confirm barbell load is set to 50% of body weight (rounded to nearest 5 lbs).'
          ]
        },
        { id: 'step4', type: 'form', badge: 'Station 4 • Upper Body Push', title: 'Bench Press Max Rep (50% BW)', shortTitle: '4. Bench Press' },
        {
          id: 'rest_after_bench50',
          type: 'rest',
          badge: 'Mandatory Recovery',
          title: '5-Minute Rest Period',
          shortTitle: 'Rest: 5 Min',
          durationSec: 5 * 60,
          nextStationTitle: 'Station 5A: One-Arm DB Row — Left (25% BW)',
          protocolNotes: [
            'Rest 5 minutes before starting the 60-second One-Arm Dumbbell Row.',
            'Set dumbbell weight to 25% of body weight (rounded to nearest 5 lbs).'
          ]
        },
        { id: 'step5', type: 'form', badge: 'Station 5A • Unilateral Pull (Left)', title: 'One-Arm DB Row — Left Arm', shortTitle: '5A. DB Row (Left)' },
        {
          id: 'rest_after_db_left',
          type: 'rest',
          badge: 'Mandatory Recovery',
          title: '3-Minute Rest Period',
          shortTitle: 'Rest: 3 Min',
          durationSec: 3 * 60,
          nextStationTitle: 'Station 5B: One-Arm DB Row — Right (25% BW)',
          protocolNotes: [
            'Rest 3 minutes before testing the Right Arm.',
            'Keep the exact same dumbbell weight used on the Left Arm.'
          ]
        },
        { id: 'step6', type: 'form', badge: 'Station 5B • Unilateral Pull (Right)', title: 'One-Arm DB Row — Right Arm', shortTitle: '5B. DB Row (Right)' },
        {
          id: 'rest_after_db_right',
          type: 'rest',
          badge: 'Mandatory Recovery',
          title: '5-Minute Rest Period',
          shortTitle: 'Rest: 5 Min',
          durationSec: 5 * 60,
          nextStationTitle: 'Station 6: Core Stability Assessment (Plank)',
          protocolNotes: [
            'Rest 5 minutes prior to the 180-second straight-arm plank assessment.',
            'Review the 8 plank stages so you are ready for smooth transitions.'
          ]
        },
        { id: 'step7', type: 'form', badge: 'Station 6 • Core Endurance', title: 'Core Stability Assessment', shortTitle: '6. Core Plank' },
        { id: 'optionalPrompt', type: 'form', badge: 'Evaluations #2 & #3 Option', title: 'Optional Additional Stations', shortTitle: 'Optional Stations?' }
      ];

      if (state.includeOptional) {
        steps.push(
          {
            id: 'rest_before_opt8',
            type: 'rest',
            badge: 'Mandatory Recovery',
            title: '5-Minute Rest Period',
            shortTitle: 'Rest: 5 Min',
            durationSec: 5 * 60,
            nextStationTitle: 'Optional Station 8: Bench Press Max Rep (120 lbs)',
            protocolNotes: ['Rest 5 minutes before Optional Bench Press (120 lbs).']
          },
          { id: 'step8', type: 'form', badge: 'Optional Station 8', title: 'Bench Press Max Rep (120 lbs)', shortTitle: '8. Bench (120 lb)' },
          {
            id: 'rest_before_opt9',
            type: 'rest',
            badge: 'Mandatory Recovery',
            title: '5-Minute Rest Period',
            shortTitle: 'Rest: 5 Min',
            durationSec: 5 * 60,
            nextStationTitle: 'Optional Station 9: Bench Pull Max Rep (50% BW)',
            protocolNotes: ['Rest 5 minutes before Optional Bench Pull (50% BW).']
          },
          { id: 'step9', type: 'form', badge: 'Optional Station 9', title: 'Bench Pull Max Rep (50% BW)', shortTitle: '9. Bench Pull' }
        );
      }

      steps.push({
        id: 'summary',
        type: 'form',
        badge: 'Results & 6-Min Erg',
        title: 'Evaluation Summary & 6-Min Erg',
        shortTitle: 'Summary & 6\' Erg'
      });

      return steps;
    }

    function getStepIndex(stepId) {
      const steps = getSteps();
      const idx = steps.findIndex(s => s.id === stepId);
      return idx >= 0 ? idx : 0;
    }

    function getBodyWeightLbs() {
      const val = parseFloat(state.bodyWeight);
      if (!val || val <= 0) return null;
      return state.weightUnit === 'kg' ? val * 2.20462 : val;
    }

    function getTargetWeight(percent) {
      const bwLbs = getBodyWeightLbs();
      if (!bwLbs) return null;
      return Math.round((bwLbs * (percent / 100)) / 5) * 5;
    }

    function getRelativeErgDistance(metersVal) {
      const dist = parseFloat(metersVal);
      const bwLbs = getBodyWeightLbs();
      if (!dist || dist <= 0 || !bwLbs) return '— (Enter BW & distance)';
      const rel = dist / bwLbs;
      return `${rel.toFixed(2)} m / lb (${(dist / (bwLbs / 2.20462)).toFixed(2)} m / kg)`;
    }

    function getRelativeErgMetersOnly(metersVal) {
      const dist = parseFloat(metersVal);
      const bwLbs = getBodyWeightLbs();
      if (!dist || dist <= 0 || !bwLbs) return '';
      return (dist / bwLbs).toFixed(2);
    }

    function updateField(field, value) {
      state[field] = value;

      if (field === 'sitReachTrial1' || field === 'sitReachTrial2' || field === 'sitReachTrial3') {
        const trials = [state.sitReachTrial1, state.sitReachTrial2, state.sitReachTrial3]
          .map(v => parseFloat(v))
          .filter(v => !Number.isNaN(v));
        if (trials.length > 0) {
          const best = Math.max(...trials);
          state.sitReachBest = String(best);
          const bestInput = document.getElementById('input-sitReachBest');
          if (bestInput) bestInput.value = state.sitReachBest;
        }
      }

      if (field === 'row2Min1Dist' || field === 'row2Split2Dist') {
        const d1 = parseFloat(state.row2Min1Dist) || 0;
        const d2 = parseFloat(state.row2Split2Dist) || 0;
        if (d1 > 0 || d2 > 0) {
          state.row2TotalDist = String(d1 + d2);
          const totalInput = document.getElementById('input-row2TotalDist');
          if (totalInput) totalInput.value = state.row2TotalDist;
        }
      }

      if (field === 'erg6Min2Dist' || field === 'erg6Min4Dist' || field === 'erg6FinalSplitDist') {
        const s1 = parseFloat(state.erg6Min2Dist) || 0;
        const s2 = parseFloat(state.erg6Min4Dist) || 0;
        const s3 = parseFloat(state.erg6FinalSplitDist) || 0;
        if (s1 > 0 || s2 > 0 || s3 > 0) {
          state.erg6TotalDist = String(s1 + s2 + s3);
          const total6Input = document.getElementById('input-erg6TotalDist');
          if (total6Input) total6Input.value = state.erg6TotalDist;
          refresh6MinRel();
          refreshErg6OnlyRel();
        }
      }

      saveState();
    }

    function showToast(message, icon = '✓') {
      const container = document.getElementById('toast-container');
      const msgEl = document.getElementById('toast-msg');
      const iconEl = document.getElementById('toast-icon');
      if (!container || !msgEl || !iconEl) return;
      msgEl.textContent = message;
      iconEl.textContent = icon;
      container.classList.remove('opacity-0', 'translate-y-4');
      container.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        container.classList.remove('opacity-100', 'translate-y-0');
        container.classList.add('opacity-0', 'translate-y-4');
      }, 2800);
    }

    function openConfirmModal(title, text, onConfirm) {
      const modal = document.getElementById('confirm-modal');
      const titleEl = document.getElementById('confirm-title');
      const textEl = document.getElementById('confirm-text');
      const yesBtn = document.getElementById('confirm-yes-btn');
      if (!modal || !titleEl || !textEl || !yesBtn) return;
      titleEl.textContent = title;
      textEl.textContent = text;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      yesBtn.onclick = () => {

    function toggleSound() {
      soundEnabled = !soundEnabled;
      updateSoundIcons();
      showToast(soundEnabled ? 'Timer chime enabled' : 'Timer chime muted', soundEnabled ? '🔔' : '🔕');
    }

    function updateSoundIcons() {
      const onIcon = document.getElementById('icon-sound-on');
      const offIcon = document.getElementById('icon-sound-off');
      if (onIcon && offIcon) {
        onIcon.classList.toggle('hidden', !soundEnabled);
        offIcon.classList.toggle('hidden', soundEnabled);
      }
    }

    async function playTimerCompleteChime() {
      if (!soundEnabled || typeof Tone === 'undefined') return;
      try {
        await Tone.start();
        const synth = new Tone.Synth().toDestination();
        const now = Tone.now();
        synth.triggerAttackRelease('C6', '0.18s', now);
        synth.triggerAttackRelease('E6', '0.18s', now + 0.22);
        synth.triggerAttackRelease('G6', '0.35s', now + 0.44);
      } catch (err) {
        console.warn('Tone chime error:', err);
      }
    }

    // Rest timer functions
    function initRestTimerForStep(step) {
      stopRestTimer();
      restTotalSec = step.durationSec || 60;
      restRemainingSec = restTotalSec;
      restRunning = false;
      updateRestTimerUI();
    }

    function toggleRestTimer() {
      if (restRunning) {
        stopRestTimer();
        updateRestTimerUI();
        return;
      }
      if (restRemainingSec <= 0) {
        restRemainingSec = restTotalSec;
      }
      restRunning = true;
      updateRestTimerUI();
      restInterval = setInterval(() => {
        restRemainingSec = Math.max(0, restRemainingSec - 1);
        updateRestTimerUI();
        if (restRemainingSec <= 0) {
          stopRestTimer();
          updateRestTimerUI();
          playTimerCompleteChime();
          showToast('Rest period complete!', '⏱️');
        }
      }, 1000);
    }

    function stopRestTimer() {
      restRunning = false;
      if (restInterval) {
        clearInterval(restInterval);
        restInterval = null;
      }
    }

    function resetRestTimer() {
      stopRestTimer();
      restRemainingSec = restTotalSec;
      updateRestTimerUI();
    }

    function skipRestTimer() {
      stopRestTimer();
      restRemainingSec = 0;
      updateRestTimerUI();
      nextStep();
    }

    function formatClock(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateRestTimerUI() {
      const clockEl = document.getElementById('rest-timer-clock');
      const btnEl = document.getElementById('btn-rest-toggle');
      const barEl = document.getElementById('rest-timer-progress');
      if (clockEl) clockEl.textContent = formatClock(restRemainingSec);
      if (btnEl) btnEl.textContent = restRunning ? 'Pause Timer' : 'Start Timer';
      if (barEl && restTotalSec > 0) {
        const pct = Math.max(0, Math.min(100, (restRemainingSec / restTotalSec) * 100));
        barEl.style.width = `${pct}%`;
      }
    }

    // Plank guide stopwatch functions
    function togglePlankGuideTimer() {
      if (plankGuideRunning) {
        stopPlankGuideTimer();
        updatePlankGuideUI();
        return;
      }
      plankGuideRunning = true;
      updatePlankGuideUI();
      plankGuideInterval = setInterval(() => {
        plankGuideElapsed += 1;
        updatePlankGuideUI();
        if (plankGuideElapsed >= 180) {
          stopPlankGuideTimer();
          updatePlankGuideUI();
          playTimerCompleteChime();
          showToast('180s Plank protocol complete!', '🏆');
        }
      }, 1000);
    }

    function stopPlankGuideTimer() {
      plankGuideRunning = false;
      if (plankGuideInterval) {
        clearInterval(plankGuideInterval);
        plankGuideInterval = null;
      }
    }

    function resetPlankGuideTimer() {
      stopPlankGuideTimer();
      plankGuideElapsed = 0;
      updatePlankGuideUI();
    }

    function recordPlankStopNow() {
      const sec = Math.min(180, plankGuideElapsed);
      stopPlankGuideTimer();
      state.plankSeconds = String(sec);
      const activeStage = PLANK_STAGES.find(st => sec >= st.start && sec < st.end) || PLANK_STAGES[PLANK_STAGES.length - 1];
      if (sec >= 180) {
        state.plankStageReached = 'Stage 8 (Full 180s Completed)';
      } else {
        state.plankStageReached = `Stage ${activeStage.stage}: ${activeStage.title}`;
      }
      saveState();
      renderCurrentStep();
      showToast(`Logged ${sec}s on Plank`, '⏱️');
    }

    function updatePlankGuideUI() {
      const clockEl = document.getElementById('plank-guide-clock');
      const btnEl = document.getElementById('btn-plank-toggle');
      const stageBadgeEl = document.getElementById('plank-guide-stage-badge');
      if (clockEl) clockEl.textContent = `${plankGuideElapsed}s / 180s`;
      if (btnEl) btnEl.textContent = plankGuideRunning ? 'Pause Stopwatch' : 'Start Live 180s Stopwatch';

      const currentStage = PLANK_STAGES.find(st => plankGuideElapsed >= st.start && plankGuideElapsed < st.end) || PLANK_STAGES[PLANK_STAGES.length - 1];
      if (stageBadgeEl) {
        stageBadgeEl.textContent = `Stage ${currentStage.stage}: ${currentStage.title}`;
      }

      PLANK_STAGES.forEach(st => {
        const row = document.getElementById(`plank-stage-row-${st.stage}`);
        if (!row) return;
        const isCurrent = st.stage === currentStage.stage;
        row.className = isCurrent
          ? 'p-2.5 rounded-xl border bg-cyan-500/15 border-cyan-400 text-white'
          : 'p-2.5 rounded-xl border bg-navy-950/60 border-navy-800 text-slate-300';
      });
    }

    function chooseOptionalPath(include) {
      state.includeOptional = include;
      saveState();
      const steps = getSteps();
      if (include) {
        const optRestIdx = steps.findIndex(s => s.id === 'rest_before_opt8');
        if (optRestIdx >= 0) {
          state.currentStepId = steps[optRestIdx].id;
          saveState();
          renderCurrentStep();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
      }
      state.currentStepId = 'summary';
      saveState();
      renderCurrentStep();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function prevStep() {
      stopRestTimer();
      stopPlankGuideTimer();
      if (state.currentStepId === 'erg6Only') {
        state.currentStepId = 'step0';
        saveState();
        renderCurrentStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      const steps = getSteps();
      const idx = getStepIndex(state.currentStepId);
      if (idx > 0) {
        state.currentStepId = steps[idx - 1].id;
        saveState();
        renderCurrentStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function nextStep() {
      stopRestTimer();
      stopPlankGuideTimer();

      if (state.currentStepId === 'step0') {
        if (!state.athleteName || !state.athleteName.trim()) {
          showToast('Please enter Athlete Full Name to begin.', '⚠️');
          const nameInput = document.getElementById('input-athleteName');
          if (nameInput) nameInput.focus();
          return;
        }
        if (!state.signature || !state.signature.trim()) {
          showToast('Please enter your Athlete Signature / Initials.', '⚠️');
          const sigInput = document.getElementById('input-signature');
          if (sigInput) sigInput.focus();
          return;
        }
        if (!state.safetyAck) {
          showToast('Please check the Safety & Warm-Up Acknowledgment box.', '⚠️');
          const ackInput = document.getElementById('input-safetyAck');
          if (ackInput) ackInput.focus();
          return;
        }
      }

      if (state.currentStepId === 'erg6Only') {
        state.currentStepId = 'summary';
        saveState();
        renderCurrentStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const steps = getSteps();
      const idx = getStepIndex(state.currentStepId);
      state.completedSteps[state.currentStepId] = true;

      if (idx >= 0 && idx < steps.length - 1) {
        state.currentStepId = steps[idx + 1].id;
        saveState();
        renderCurrentStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

            class="block w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-purple-500/20 file:text-purple-200 hover:file:bg-purple-500/30 cursor-pointer" />

          ${erg6PhotoPreviewUrl ? `

              <div class="min-w-0">
                <div class="text-xs font-bold text-emerald-400 truncate">Photo Attached: ${escapeHtml(erg6PhotoFileName)}</div>

    function handleErg6PhotoChange(input) {
      const file = input && input.files && input.files[0];
      if (!file) return;

      if (!file.type || !file.type.startsWith('image/')) {
        showToast('Please select an image file.', '⚠️');
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          try {
            // Resize to max 1000px wide so preview & payload stay lightweight
            const maxDim = 1000;
            let width = img.width;
            let height = img.height;
            if (width > maxDim || height > maxDim) {
              if (width >= height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
            erg6PhotoPreviewUrl = compressedDataUrl;
            erg6PhotoFileName = file.name;
            erg6PhotoBase64 = compressedDataUrl.split(',')[1] || '';
            showToast('6-minute erg photo attached!', '📷');
            renderCurrentStep();
          } catch (err) {
            console.warn('Image compression failed, using original file:', err);
            erg6PhotoPreviewUrl = event.target.result;
            erg6PhotoFileName = file.name;
            erg6PhotoBase64 = String(event.target.result || '').split(',')[1] || '';
            showToast('6-minute erg photo attached!', '📷');
            renderCurrentStep();
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearErg6Photo() {
      erg6PhotoPreviewUrl = '';
      erg6PhotoFileName = '';
      erg6PhotoBase64 = '';
      showToast('6-minute erg photo removed', '🗑️');
      renderCurrentStep();
    }

      const box = document.getElementById('bw-target-preview');
      if (!box) return;
      box.innerHTML = `
        <div class="bg-navy-950/90 border border-navy-800 rounded-xl px-3 py-2 flex items-center justify-between">
          <span class="text-xs text-slate-400">50% BW (Bench Press/Pull)</span>
          <span class="text-xs font-mono font-bold text-purple-300">${getTargetWeight(50) ? getTargetWeight(50) + ' lbs' : '—'}</span>
        </div>
        <div class="bg-navy-950/90 border border-navy-800 rounded-xl px-3 py-2 flex items-center justify-between">
          <span class="text-xs text-slate-400">25% BW (One-Arm DB Row)</span>
          <span class="text-xs font-mono font-bold text-purple-300">${getTargetWeight(25) ? getTargetWeight(25) + ' lbs' : '—'}</span>
        </div>
      `;
    }

    // =========================================================================
    // INTERACTIVE HELPERS FOR STEP 0 & SUMMARY
    // =========================================================================
    function setWeightUnit(unit) {
      state.weightUnit = unit;
      saveState();
      renderCurrentStep();
    }

    function refreshTargetPreviews() {
      const box = document.getElementById('bw-target-preview');
      if (!box) return;
      box.innerHTML = `
        <div class="bg-navy-950/90 border border-navy-800 rounded-xl px-3 py-2 flex items-center justify-between">
          <span class="text-xs text-slate-400">50% BW (Bench Press/Pull)</span>
          <span class="text-xs font-mono font-bold text-cyan-400">${getTargetWeight(50) ? getTargetWeight(50) + ' lbs' : '—'}</span>
        </div>
        <div class="bg-navy-950/90 border border-navy-800 rounded-xl px-3 py-2 flex items-center justify-between">
          <span class="text-xs text-slate-400">25% BW (One-Arm DB Row)</span>
          <span class="text-xs font-mono font-bold text-cyan-400">${getTargetWeight(25) ? getTargetWeight(25) + ' lbs' : '—'}</span>
        </div>
      `;
    }

    function setRating(field, val) {
      state[field] = val;
      saveState();
      renderCurrentStep();
    }

    function refresh6MinRel() {
      const el = document.getElementById('rel-6min-display');
      if (el) el.textContent = getRelativeErgDistance(state.erg6TotalDist);
    }

    function refreshErg6OnlyRel() {
      const el = document.getElementById('rel-6min-only-display');
      if (el) el.textContent = getRelativeErgDistance(state.erg6TotalDist);
    }

    function openSixMinErgReturn() {
      state.submissionType = '6-Min Erg Follow-Up';
      state.currentStepId = 'erg6Only';
      saveState();
      renderCurrentStep();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function startFullEvaluation() {
      state.submissionType = 'Full Evaluation';
      state.currentStepId = 'step0';
      saveState();
      renderCurrentStep();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // GOOGLE SHEETS SUBMISSION HANDLER
    // =========================================================================
    function buildGoogleSheetPayload() {
      return {
        timestamp: new Date().toISOString(),
        submissionType: state.submissionType || 'Full Evaluation',
        evalDate: state.evalDate || '',
        erg6Date: state.erg6Date || '',
        athleteName: (state.athleteName || '').trim(),
        signature: (state.signature || '').trim(),
        ageCategory: state.ageCategory || '',
        bodyWeight: state.bodyWeight || '',
        weightUnit: state.weightUnit || 'lbs',
        restingHR: state.morningRHR || '',
        sleepQuantity: state.sleepQuantity ?? '',
        sleepQuality: state.sleepQuality ?? '',
        sitAndReachCm: state.sitReachBest || '',
        erg2MinTotalDist: state.row2TotalDist || '',
        erg2Min1mRpe: state.row2Min1Effort || '',
        erg2Min1mDist: state.row2Min1Dist || '',
        erg2MinFinishRpe: state.row2FinishEffort || '',
        erg2Min2ndSplitDist: state.row2Split2Dist || '',
        erg2MinFinishHR: state.row2FinishHR || '',
        erg2MinBwRelDist: getRelativeErgMetersOnly(state.row2TotalDist),
        pullUpsReps: state.pullUpReps ?? '',
        pullUpsBand: state.pullUpBand || '',
        bench50Load: state.bench50Load || '',
        bench50Reps: state.bench50Reps ?? '',
        rowLeftLoad: state.dbRowLeftLoad || '',
        rowLeftReps: state.dbRowLeftReps ?? '',
        rowRightLoad: state.dbRowRightLoad || '',
        rowRightReps: state.dbRowRightReps ?? '',
        plankSec: state.plankSeconds ?? '',
        optBench120Load: state.optBench120Load || '',
        optBench120Reps: state.optBench120Reps ?? '',
        optBenchPullLoad: state.optBenchPullLoad || '',
        optBenchPullReps: state.optBenchPullReps ?? '',
        erg6MinTotalDist: state.erg6TotalDist || '',
        erg6Min2mRpe: state.erg6Min2Effort || '',
        erg6Min2mDist: state.erg6Min2Dist || '',
        erg6Min4mRpe: state.erg6Min4Effort || '',
        erg6Min4mDist: state.erg6Min4Dist || '',
        erg6MinFinishRpe: state.erg6FinishEffort || '',
        erg6MinFinalSplitDist: state.erg6FinalSplitDist || '',
        erg6MinFinishHR: state.erg6FinishHR || '',
        erg6MinBwRelDist: getRelativeErgMetersOnly(state.erg6TotalDist),
        erg6PhotoAttached: Boolean(erg6PhotoBase64),
        erg6PhotoFileName: erg6PhotoFileName || ''
      };
    }

    function setSheetFeedback(type, message) {
      const box = document.getElementById('sheet-submit-feedback');
      if (!box) return;
      box.classList.remove('hidden');
      if (type === 'success') {
        box.innerHTML = `
          <div class="p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-semibold flex items-start gap-2">
            <span class="shrink-0">✅</span>
            <span>${escapeHtml(message)}</span>
          </div>
        `;
      } else {
        box.innerHTML = `
          <div class="p-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-200 text-xs font-medium flex items-start gap-2">
            <span class="shrink-0">⚠️</span>
            <span>${escapeHtml(message)} Your local browser backup is intact—you can also use <strong>Download CSV</strong> or <strong>Copy Results</strong> below.</span>
          </div>
        `;
      }
    }

    async function submitToGoogleSheet() {
      if (isSubmittingToSheet) return;

      // Validate required baseline field
      if (!state.athleteName || !state.athleteName.trim()) {
        showToast('Please enter Athlete Name in Step 0 before submitting.', '⚠️');
        setSheetFeedback('error', 'Missing Athlete Name: Please return to Step 0 to enter your name before submitting.');
        return;
      }

      const endpointUrl = getActiveGoogleScriptUrl();
      if (!endpointUrl) {
        showToast('Google Sheet Web App URL is not configured yet.', '⚠️');
        setSheetFeedback('error', 'No Google Sheet Web App URL is configured in the script or URL parameter.');
        return;
      }

      isSubmittingToSheet = true;
      renderCurrentStep();

      const payload = buildGoogleSheetPayload();

      try {
        // Google Apps Script Web Apps redirect POST responses to googleusercontent.com,
        // which can trigger a browser CORS "Failed to fetch" even after the row is written.
        // Using mode: 'no-cors' sends the JSON payload cleanly and succeeds reliably.
        await fetch(endpointUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const formattedTime = new Date().toLocaleString();
        state.lastSheetSubmission = formattedTime;
        saveState();
        isSubmittingToSheet = false;
        renderCurrentStep();
        setSheetFeedback('success', `Results sent to Google Sheet! (${formattedTime})`);
        showToast('Submitted to Google Sheet!', '✅');
      } catch (err) {
        console.error('Google Sheet submission error:', err);
        isSubmittingToSheet = false;
        renderCurrentStep();
        setSheetFeedback('error', `Could not reach Google Sheet (${err.message || 'Network error'}).`);
        showToast('Submission failed — check connection or URL.', '⚠️');
      }
    }

    async function submitSixMinErgFollowUp() {
      if (!state.athleteName || !state.athleteName.trim()) {
        showToast('Please enter your Athlete Full Name first.', '⚠️');
        const el = document.getElementById('input-erg6-athleteName');
        if (el) el.focus();
        return;
      }
      if (!state.erg6TotalDist || parseFloat(state.erg6TotalDist) <= 0) {
        showToast('Please enter Total 6-Minute Erg Distance (meters).', '⚠️');
        return;
      }
      state.submissionType = '6-Min Erg Follow-Up';
      saveState();
      await submitToGoogleSheet();
    }

    // =========================================================================
    // EXPORT FUNCTIONS (CLIPBOARD & CSV)
    // =========================================================================
    function buildSummaryPlainText() {
      const u = state.weightUnit;
      const lines = [
        'BARRACUDA DRACONA FITNESS EVALUATION 2026-2027 RESULTS',
        `Evaluation Date: ${state.evalDate || new Date().toLocaleDateString()}`,
        `Athlete: ${state.athleteName || 'N/A'} | Category: ${state.ageCategory}`,
        `Body Weight: ${state.bodyWeight || 'N/A'} ${u} | Morning RHR: ${state.morningRHR || 'N/A'} BPM`,
        `Sleep Quantity: ${state.sleepQuantity}/10 | Sleep Quality: ${state.sleepQuality}/10`,
        '--------------------------------------------------',
        `1. Sit & Reach (Best of 3): ${state.sitReachBest || 'N/A'} cm (Trials: ${state.sitReachTrial1 || '-'}, ${state.sitReachTrial2 || '-'}, ${state.sitReachTrial3 || '-'})`,
        `2. 2-Min Row Erg: ${state.row2TotalDist || 'N/A'} m | 1' Dist: ${state.row2Min1Dist || '-'} m (Borg ${state.row2Min1Effort || '-'}) | 2nd Split: ${state.row2Split2Dist || '-'} m (Borg ${state.row2FinishEffort || '-'}) | Finish HR: ${state.row2FinishHR || '-'} BPM`,
        `   2-Min BW Relative Distance: ${getRelativeErgDistance(state.row2TotalDist)}`,
        `3. Dead Hang Pull-Ups: ${state.pullUpReps || 'N/A'} reps (Band: ${state.pullUpBand})`,
        `4. Max Rep Bench Press (50% BW): ${state.bench50Reps || 'N/A'} reps @ ${state.bench50Load || 'N/A'} lbs`,
        `5A. 1' One-Arm DB Row Left (25% BW): ${state.dbRowLeftReps || 'N/A'} reps @ ${state.dbRowLeftLoad || 'N/A'} lbs`,
        `5B. 1' One-Arm DB Row Right (25% BW): ${state.dbRowRightReps || 'N/A'} reps @ ${state.dbRowRightLoad || 'N/A'} lbs`,
        `6. Core Stability (Straight-Arm Plank): ${state.plankSeconds || 'N/A'} sec (${state.plankStageReached})`
      ];

      if (state.includeOptional || state.optBench120Reps || state.optBenchPullReps) {
        lines.push(
          '--- Optional Assessments (Evals #2 & #3) ---',
          `8. Bench Press (120 lbs): ${state.optBench120Reps || 'N/A'} reps @ ${state.optBench120Load} lbs`,
          `9. Bench Pull (50% BW): ${state.optBenchPullReps || 'N/A'} reps @ ${state.optBenchPullLoad || 'N/A'} lbs`
        );
      }

      if (state.erg6TotalDist) {
        lines.push(
          `--- 6-Minute Personal Row Erg (${state.erg6Date || 'Date N/A'}) ---`,
          `Total Distance: ${state.erg6TotalDist} m | 2': ${state.erg6Min2Dist || '-'}m (RPE ${state.erg6Min2Effort || '-'}) | 4': ${state.erg6Min4Dist || '-'}m (RPE ${state.erg6Min4Effort || '-'}) | Finish Split: ${state.erg6FinalSplitDist || '-'}m (RPE ${state.erg6FinishEffort || '-'}) | HR: ${state.erg6FinishHR || '-'} BPM`,
          `6-Min BW Relative Distance: ${getRelativeErgDistance(state.erg6TotalDist)}`
        );
      }

      return lines.join('\n');
    }

    function copyResultsToClipboard() {
      const text = buildSummaryPlainText();
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Results copied to clipboard!', '📋');
      } catch (err) {
        showToast('Unable to copy automatically.', '⚠️');
      }
      document.body.removeChild(textarea);
    }

    function downloadCSV() {
      const rows = [
        ['Field', 'Value', 'Unit / Notes'],
        ['Evaluation Date', state.evalDate, ''],
        ['6-Min Erg Date', state.erg6Date, ''],
        ['Athlete Name', state.athleteName, ''],
        ['Age Category', state.ageCategory, ''],
        ['Body Weight', state.bodyWeight, state.weightUnit],
        ['Morning Resting HR', state.morningRHR, 'BPM'],
        ['Sleep Quantity', state.sleepQuantity, '1-10'],
        ['Sleep Quality', state.sleepQuality, '1-10'],
        ['Sit & Reach Best', state.sitReachBest, 'cm'],
        ['2-Min Row Erg Total Distance', state.row2TotalDist, 'meters'],
        ['2-Min Row 1-Min Effort', state.row2Min1Effort, 'Borg 1-20'],
        ['2-Min Row 1-Min Distance', state.row2Min1Dist, 'meters'],
        ['2-Min Row Finish Effort', state.row2FinishEffort, 'Borg 1-20'],
        ['2-Min Row 2nd Split Distance', state.row2Split2Dist, 'meters'],
        ['2-Min Row Finish HR', state.row2FinishHR, 'BPM'],
        ['2-Min BW Relative Row Distance', getRelativeErgDistance(state.row2TotalDist), ''],
        ['Dead Hang Pull-Ups Reps', state.pullUpReps, state.pullUpBand],
        ['Bench Press 50% BW Load', state.bench50Load, 'lbs'],
        ['Bench Press 50% BW Reps', state.bench50Reps, 'reps'],
        ['1-Min DB Row Left Load', state.dbRowLeftLoad, 'lbs'],
        ['1-Min DB Row Left Reps', state.dbRowLeftReps, 'reps'],
        ['1-Min DB Row Right Load', state.dbRowRightLoad, 'lbs'],
        ['1-Min DB Row Right Reps', state.dbRowRightReps, 'reps'],
        ['Core Stability Plank Time', state.plankSeconds, 'seconds'],
        ['Core Stability Stage', state.plankStageReached, ''],
        ['Optional Bench Press 120lb Load', state.optBench120Load, 'lbs'],
        ['Optional Bench Press 120lb Reps', state.optBench120Reps, 'reps'],
        ['Optional Bench Pull 50% BW Load', state.optBenchPullLoad, 'lbs'],
        ['Optional Bench Pull 50% BW Reps', state.optBenchPullReps, 'reps'],
        ['6-Min Row Erg Total Distance', state.erg6TotalDist, 'meters'],
        ['6-Min Row 2-Min Effort', state.erg6Min2Effort, 'Borg 1-20'],
        ['6-Min Row 2-Min Distance', state.erg6Min2Dist, 'meters'],
        ['6-Min Row 4-Min Effort', state.erg6Min4Effort, 'Borg 1-20'],
        ['6-Min Row 4-Min Distance', state.erg6Min4Dist, 'meters'],
        ['6-Min Row Finish Effort', state.erg6FinishEffort, 'Borg 1-20'],
        ['6-Min Row Final Split Distance', state.erg6FinalSplitDist, 'meters'],
        ['6-Min Row Finish HR', state.erg6FinishHR, 'BPM']
      ];

      const csvContent = rows
        .map(r => r.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const safeName = (state.athleteName || 'Athlete').replace(/[^a-z0-9]/gi, '_');
      link.href = url;
      link.download = `BARRACUDA_DRACONA_Eval_2026_2027_${safeName}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('CSV file downloaded!', '📥');
    }

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      updateSoundIcons();
      renderCurrentStep();
    });
  </script>
